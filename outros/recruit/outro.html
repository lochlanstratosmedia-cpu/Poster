<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recruit outro</title>
<style>
  /* Love's fonts: Proxima Nova files in assets/fonts/ win, Montserrat stands in. */
  @font-face { font-family: "Brand Sans"; font-weight: 300; src: url("../../assets/fonts/ProximaNova-Light.otf"); }
  @font-face { font-family: "Brand Sans"; font-weight: 600; src: url("../../assets/fonts/ProximaNova-Semibold.otf"); }
  @font-face { font-family: "Brand Sans Fallback"; font-weight: 300; src: url("../../assets/fonts/Montserrat-Light.ttf"); }
  @font-face { font-family: "Brand Sans Fallback"; font-weight: 600; src: url("../../assets/fonts/Montserrat-SemiBold.ttf"); }
  @font-face { font-family: "Gloock"; src: url("../../assets/fonts/Gloock.ttf"); }

  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body.render { background: transparent; }
  #wrap { position: absolute; inset: 0; display: grid; place-items: center; }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden; transform-origin: center;
    background: #090909; color: #e6e1d8; font-family: "Brand Sans", "Brand Sans Fallback", sans-serif;
  }
  #stage * { box-sizing: border-box; }
  .abs { position: absolute; left: 0; right: 0; text-align: center; }
  .serif { font-family: "Gloock", serif; letter-spacing: -.005em; }
  .caps { font-weight: 600; text-transform: uppercase; letter-spacing: .42em; color: #a9a196; }
  .light { font-weight: 300; color: #cfc9bf; }
  .chars span { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }
  .scene { position: absolute; inset: 0; transform-origin: 50% 50%; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<script>
// Recruitment outro for Love, editorial cut. Four quiet scenes and a sign-off:
//   One agent. One office. One time only.
//   80% commission split
//   Broadmeadow office
//   A confidential chat with Liam & Connor
//   Send us a message. + Love logo
// Type reveals letter by letter out of a blur, every scene pushes in slowly,
// and a fine grain and drifting warm light sit over the black.
// Pure function of time: draw(t) sets the frame, render.mjs steps it.
// Earlier cuts: scenes.html (bold scene version), stacked.html (single card).

const params = new URLSearchParams(location.search);
const RENDER = params.has("render");
const DURATION = 17;
const stage = document.getElementById("stage");
const pending = [];
const LOGO = params.get("love") || "../../assets/logos/love-white.png";

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, s, d) => clamp((t - s) / d);
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = p => 1 - Math.pow(1 - p, 4);
const easeInOut = p => p < .5 ? 8 * p ** 4 : 1 - Math.pow(-2 * p + 2, 4) / 2;

function el(tag, css = {}, parent = stage, html = "") {
  const e = document.createElement(tag);
  Object.assign(e.style, css);
  if (html) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
function img(parent, css) {
  const i = el("img", css, parent);
  pending.push(new Promise(r => { i.onload = r; i.onerror = r; }));
  i.src = LOGO;
  return i;
}

// ---- atmosphere ----
const light = el("div", { position: "absolute", width: "1600px", height: "1600px", left: "-260px", top: "160px", borderRadius: "50%", background: "radial-gradient(circle, rgba(214,196,168,.11) 0%, rgba(214,196,168,.04) 35%, rgba(214,196,168,0) 65%)" });
el("div", { position: "absolute", inset: 0, background: "radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 45%, rgba(0,0,0,.7) 100%)" });

// ---- scenes ----
const scenes = [];
function scene(start, end) {
  const root = el("div", {}); root.className = "scene";
  const s = { start, end, root, items: [] };
  scenes.push(s);
  return s;
}
// text split into letters; each letter comes in out of a blur
function text(s, html, css, cls, at, { gap = .032, dur = 1.1 } = {}) {
  const n = el("div", css, s.root);
  n.className = "abs chars " + cls;
  const spans = [];
  // walk the markup so <br> survives
  html.split(/(<br>)/).forEach(part => {
    if (part === "<br>") { el("br", {}, n); return; }
    [...part.replace(/&amp;/g, "&")].forEach(ch => { const sp = el("span", {}, n); sp.textContent = ch; spans.push(sp); });
  });
  s.items.push({ type: "chars", spans, at, gap, dur });
  return n;
}
function hair(s, top, width, at) {
  const n = el("div", { position: "absolute", left: (540 - width / 2) + "px", width: width + "px", top: top + "px", height: "1.5px", background: "linear-gradient(90deg, rgba(201,173,127,0), #c9ad7f, rgba(201,173,127,0))" }, s.root);
  s.items.push({ type: "draw", n, at });
}

// 1. the three "One"s build in a single shot
const s1 = scene(0, 4.6);
text(s1, "One agent.", { top: "700px", fontSize: "116px", lineHeight: "140px" }, "serif", .35);
text(s1, "One office.", { top: "850px", fontSize: "116px", lineHeight: "140px" }, "serif", 1.25);
text(s1, "One time only.", { top: "1000px", fontSize: "116px", lineHeight: "140px" }, "serif", 2.15);

// 2. the offer
const s2 = scene(4.6, 7.6);
const fig = text(s2, "80%", { top: "640px", fontSize: "330px", lineHeight: "360px" }, "serif", .2, { gap: .09, dur: 1.3 });
hair(s2, 1060, 260, .9);
text(s2, "Commission split", { top: "1105px", fontSize: "31px" }, "caps", 1.1, { gap: .025 });

// 3. where
const s3 = scene(7.6, 10.2);
text(s3, "Broadmeadow", { top: "820px", fontSize: "130px", lineHeight: "150px" }, "serif", .2);
hair(s3, 1010, 200, .8);
text(s3, "Office", { top: "1055px", fontSize: "31px" }, "caps", 1.0);

// 4. who
const s4 = scene(10.2, 13.2);
text(s4, "A confidential chat with", { top: "760px", fontSize: "44px" }, "light", .2, { gap: .02 });
text(s4, "Liam &amp; Connor", { top: "860px", fontSize: "124px", lineHeight: "150px" }, "serif", .8);

// 5. the ask and the sign-off, held to the end
const s5 = scene(13.2, 99);
text(s5, "Send us<br>a message.", { top: "640px", fontSize: "140px", lineHeight: "160px" }, "serif", .2, { gap: .04 });
hair(s5, 1030, 220, 1.3);
const endLogo = img(s5.root, { position: "absolute", left: "400px", top: "1110px", width: "280px" });
s5.items.push({ type: "fade", n: endLogo, at: 1.6 });

// small Love mark at the top through scenes 1 to 4
const mark = img(stage, { position: "absolute", left: "478px", top: "190px", width: "124px" });

// ---- grain: a few noise tiles, cycled frame by frame ----
const grain = el("canvas", { position: "absolute", inset: 0, width: "1080px", height: "1920px", mixBlendMode: "screen", opacity: .07, imageRendering: "pixelated" });
grain.width = 540; grain.height = 960;
const gctx = grain.getContext("2d");
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const tiles = [0, 1, 2, 3, 4, 5].map(() => {
  const d = gctx.createImageData(540, 960);
  for (let i = 0; i < d.data.length; i += 4) { const v = rnd() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  return d;
});

function draw(t) {
  // warm light drifts slowly from left to right and back
  light.style.transform = `translate(${Math.sin(t * .18) * 220}px, ${Math.cos(t * .13) * 120}px)`;

  scenes.forEach(s => {
    const on = t >= s.start && t < s.end;
    s.root.style.display = on ? "block" : "none";
    if (!on) return;
    const lt = t - s.start, len = Math.min(s.end, DURATION) - s.start;
    const out = easeInOut(prog(t, s.end - .6, .6));
    s.root.style.opacity = 1 - out;
    s.root.style.filter = out > 0 ? `blur(${10 * out}px)` : "none";
    s.root.style.transform = `scale(${1 + .04 * (lt / len) + .015 * out})`;   // slow push-in
    s.items.forEach(it => {
      if (it.type === "chars") it.spans.forEach((sp, i) => {
        const p = easeOut(prog(lt, it.at + i * it.gap, it.dur));
        sp.style.opacity = p;
        sp.style.filter = p < 1 ? `blur(${(1 - p) * 16}px)` : "none";
        sp.style.transform = `translateY(${(1 - p) * 22}px)`;
      });
      if (it.type === "draw") it.n.style.transform = `scaleX(${easeInOut(prog(lt, it.at, 1.2))})`;
      if (it.type === "fade") {
        const p = easeOut(prog(lt, it.at, 1.4));
        it.n.style.opacity = p;
        it.n.style.filter = p < 1 ? `blur(${(1 - p) * 10}px)` : "none";
      }
    });
  });

  const m = easeOut(prog(t, .1, 1.4)) * (1 - easeInOut(prog(t, 12.6, .6)));
  mark.style.opacity = m * .85;

  gctx.putImageData(tiles[Math.floor(t * 24) % tiles.length], 0, 0);
}

window.draw = draw;
window.DURATION = DURATION;
window.ready = Promise.all([document.fonts.ready, ...pending]).then(() => true);

if (RENDER) {
  document.body.classList.add("render");
  document.getElementById("wrap").style.placeItems = "start";
} else {
  const fit = () => stage.style.transform = `scale(${Math.min(innerWidth / 1080, innerHeight / 1920)})`;
  fit(); addEventListener("resize", fit);
  window.ready.then(() => {
    const t0 = performance.now();
    const loop = now => { draw(((now - t0) / 1000) % (DURATION + 1)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
