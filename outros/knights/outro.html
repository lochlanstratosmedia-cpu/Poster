<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knights outro</title>
<style>
  /* Love's fonts. Proxima Nova is licensed, so drop the files into
     assets/fonts/ under these names and they win. Until then Montserrat
     stands in. Gloock is free (OFL) and is the real thing. */
  @font-face { font-family: "Brand Sans"; font-weight: 400; src: url("../../assets/fonts/ProximaNova-Regular.otf"); }
  @font-face { font-family: "Brand Sans"; font-weight: 600; src: url("../../assets/fonts/ProximaNova-Semibold.otf"); }
  @font-face { font-family: "Brand Sans"; font-weight: 800; src: url("../../assets/fonts/ProximaNova-Extrabold.otf"); }
  @font-face { font-family: "Brand Sans Fallback"; font-weight: 400; src: url("../../assets/fonts/Montserrat-Regular.ttf"); }
  @font-face { font-family: "Brand Sans Fallback"; font-weight: 600; src: url("../../assets/fonts/Montserrat-SemiBold.ttf"); }
  @font-face { font-family: "Brand Sans Fallback"; font-weight: 800; src: url("../../assets/fonts/Montserrat-ExtraBold.ttf"); }
  @font-face { font-family: "Gloock"; src: url("../../assets/fonts/Gloock.ttf"); }

  :root {
    --navy: #0a2d6e;
    --red: #d3202f;
    --white: #ffffff;
  }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body.render { background: transparent; }
  #wrap { position: absolute; inset: 0; display: grid; place-items: center; }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    transform-origin: center center; font-family: "Brand Sans", "Brand Sans Fallback", sans-serif; color: var(--white);
  }
  #stage * { box-sizing: border-box; }
  .letters span { display: inline-block; will-change: transform, opacity; }
  .serif { font-family: "Gloock", serif; font-weight: 400; }
  .caps { font-family: "Brand Sans", "Brand Sans Fallback", sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: .22em; }

  .lockup { position: absolute; left: 50%; display: flex; align-items: center; justify-content: center; gap: 46px; transform: translateX(-50%); }
  .slot { display: grid; place-items: center; }
  .slot img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
  .lockup .x { width: 3px; align-self: stretch; margin: 18px 0; background: currentColor; opacity: .35; border-radius: 2px; }
  .ph {
    width: 100%; height: 100%; border: 4px dashed currentColor; border-radius: 22px;
    display: grid; place-items: center; text-align: center; font-weight: 800; font-size: 26px;
    letter-spacing: .2em; line-height: 1.3; opacity: .7;
  }

  #picker {
    position: fixed; top: 12px; left: 12px; z-index: 10; display: flex; gap: 6px; flex-wrap: wrap;
    font: 14px/1 system-ui, sans-serif;
  }
  #picker a { color: #fff; background: #333; padding: 8px 10px; border-radius: 6px; text-decoration: none; }
  #picker a.on { background: #d3202f; }
  body.render #picker { display: none; }
</style>
</head>
<body>
<div id="picker"></div>
<div id="wrap"><div id="stage"></div></div>

<script>
// Every variant is a pure function of time: draw(t) sets the whole frame for
// t seconds. render.mjs steps t frame by frame; the preview just plays it.
//
// Logos: logos/love.png and logos/knights.png next to this file are picked up
// automatically. ?love=...&knights=... point somewhere else. Missing files
// show a labelled placeholder so the layout still reads.

const params = new URLSearchParams(location.search);
const VARIANT = params.get("v") || "card";
const RENDER = params.has("render");
const DURATION = 8;
const LOGO_SRC = {
  love: params.get("love") || "logos/love.png",
  knights: params.get("knights") || "logos/knights.png",
};
const RED = "#d3202f", NAVY = "#0a2d6e";

const stage = document.getElementById("stage");
const NS = "http://www.w3.org/2000/svg";
const pending = [];

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, start, dur) => clamp((t - start) / dur);
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeOutBack = p => { const c = 1.6; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const thump = (t, at, len = .32) => { const x = (t - at) / len; return x > 0 && x < 1 ? Math.sin(Math.PI * x) : 0; };
// heart that keeps a gentle beat once it has landed
const beat = (t, at) => 1 + .1 * thump(t, at) + .06 * thump(t, at + .4) + (t > at + 1.2 ? .018 * Math.sin((t - at - 1.2) * 5.5) : 0);

function el(tag, css = {}, parent = stage, html = "") {
  const e = document.createElement(tag);
  Object.assign(e.style, css);
  if (html) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
function svgEl(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function fullSvg(parent = stage) {
  return svgEl("svg", { width: 1080, height: 1920, viewBox: "0 0 1080 1920", style: "position:absolute;left:0;top:0;overflow:visible" }, parent);
}
function letters(parent, text, css, cls = "") {
  const box = el("div", css, parent);
  box.className = "letters " + cls;
  const spans = [...text].map(ch => {
    const s = el("span", {}, box);
    s.textContent = ch === " " ? " " : ch;
    return s;
  });
  return { box, spans };
}
function riseLetters(spans, t, start, { gap = .045, dur = .55, dist = 90 } = {}) {
  spans.forEach((s, i) => {
    const p = prog(t, start + i * gap, dur);
    s.style.opacity = clamp(p * 2);
    s.style.transform = `translateY(${(1 - easeOutBack(p)) * dist}px)`;
  });
}
function fadeUp(node, t, start, dur = .7, dist = 30) {
  const p = easeOut(prog(t, start, dur));
  node.style.opacity = p;
  node.style.translate = `0 ${(1 - p) * dist}px`;
}
function strokeDraw(path, p) {
  const L = path._len || (path._len = path.getTotalLength());
  path.style.strokeDasharray = L;
  path.style.strokeDashoffset = L * (1 - p);
}
function heartPath(cx, cy, r) {
  const k = r / 210;
  const P = (x, y) => `${cx + x * k} ${cy + y * k}`;
  return `M ${P(0, 200)} C ${P(-120, 100)} ${P(-210, 30)} ${P(-210, -60)} ` +
         `C ${P(-210, -140)} ${P(-150, -190)} ${P(-90, -190)} C ${P(-40, -190)} ${P(-10, -160)} ${P(0, -130)} ` +
         `C ${P(10, -160)} ${P(40, -190)} ${P(90, -190)} C ${P(150, -190)} ${P(210, -140)} ${P(210, -60)} ` +
         `C ${P(210, 30)} ${P(120, 100)} ${P(0, 200)} Z`;
}

// One logo, or its placeholder if the file is missing.
function logoSlot(parent, key, w, h, color) {
  const slot = el("div", { width: w + "px", height: h + "px", color }, parent);
  slot.className = "slot";
  const ph = () => { slot.innerHTML = ""; el("div", {}, slot, key === "love" ? "LOVE<br>LOGO" : "KNIGHTS<br>LOGO").className = "ph"; };
  const img = new Image();
  pending.push(new Promise(done => {
    img.onload = () => { slot.appendChild(img); done(); };
    img.onerror = () => { ph(); done(); };
  }));
  img.src = LOGO_SRC[key];
  return slot;
}
// Love logo | Knights logo, side by side
function lockup(parent, top, { w = 330, h = 190, color = NAVY } = {}) {
  const box = el("div", { top: top + "px", color }, parent);
  box.className = "lockup";
  const a = logoSlot(box, "love", w, h, color);
  const x = el("div", {}, box); x.className = "x";
  const b = logoSlot(box, "knights", w, h, color);
  return { box, parts: [a, x, b] };
}
function showLockup(L, t, start) {
  L.parts.forEach((p, i) => {
    const q = prog(t, start + i * .15, .6);
    p.style.opacity = easeOut(q);
    p.style.transform = i === 1 ? `scaleY(${easeOut(q)})` : `translateY(${(1 - easeOutBack(q)) * 50}px) scale(${lerp(.85, 1, easeOut(q))})`;
  });
}

// Red and blue stripes. Each stripe slides in on its own, alternating
// direction, then the whole field drifts slowly so the frame never sits dead.
function stripes({ angle = 0, width = 120, from = "vertical", start = 0, stagger = .05, dur = .7, drift = 14 } = {}) {
  const field = el("div", { position: "absolute", left: "-60%", top: "-30%", width: "220%", height: "160%", transform: `rotate(${angle}deg)` });
  const n = Math.ceil(3100 / width) + 2;
  const list = [...Array(n)].map((_, i) => {
    const horiz = from === "horizontal";
    const s = el("div", {
      position: "absolute", background: i % 2 ? NAVY : RED,
      ...(horiz ? { left: 0, right: 0, top: i * width + "px", height: width + 1 + "px" }
                : { top: 0, bottom: 0, left: i * width + "px", width: width + 1 + "px" })
    }, field);
    return { s, i, horiz };
  });
  const shade = el("div", { position: "absolute", inset: 0, background: "radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 30%, rgba(4,12,32,.45) 100%)" });
  return t => {
    const d = (t * drift) % (width * 2);
    field.style.transform = `rotate(${angle}deg) translate${from === "horizontal" ? "Y" : "X"}(${-d}px)`;
    list.forEach(({ s, i, horiz }) => {
      const p = easeInOut(prog(t, start + (i % 24) * stagger, dur));
      const off = (1 - p) * 110 * (i % 2 ? 1 : -1);
      s.style.transform = horiz ? `translateX(${off}%)` : `translateY(${off}%)`;
    });
    shade.style.opacity = easeOut(prog(t, start + .4, 1));
  };
}

// ---------- variants ----------
const VARIANTS = {};

// 1. Card: diagonal stripes sweep in, a white card rises with the heart, type and both logos.
VARIANTS.card = function () {
  stage.style.background = NAVY;
  const bg = stripes({ angle: 28, width: 110, start: 0, stagger: .035, dur: .8 });
  const card = el("div", { position: "absolute", left: "90px", top: "330px", width: "900px", height: "1260px", background: "#fff", borderRadius: "44px", boxShadow: "0 40px 90px rgba(0,0,0,.35)" });
  const svg = fullSvg(card);
  svg.setAttribute("viewBox", "0 0 900 1260"); svg.setAttribute("width", 900); svg.setAttribute("height", 1260);
  const hg = svgEl("g", {}, svg);
  const hFill = svgEl("path", { d: heartPath(450, 260, 120), fill: RED }, hg);
  const hLine = svgEl("path", { d: heartPath(450, 260, 120), fill: "none", stroke: RED, "stroke-width": 16, "stroke-linejoin": "round" }, hg);
  const title = letters(card, "Go Knights", { position: "absolute", left: 0, right: 0, top: "450px", textAlign: "center", color: NAVY, fontSize: "158px", lineHeight: 1 }, "serif");
  const sub = el("div", { position: "absolute", left: 0, right: 0, top: "650px", textAlign: "center", color: RED, fontSize: "36px" }, card, "With love from Newcastle");
  sub.className = "caps";
  const rule = el("div", { position: "absolute", left: "150px", right: "150px", top: "770px", height: "3px", background: NAVY, opacity: .15 }, card);
  const L = lockup(card, 860, { w: 320, h: 230 });

  return t => {
    bg(t);
    const cp = prog(t, .9, .8);
    card.style.opacity = clamp(cp * 3);
    card.style.transform = `translateY(${(1 - easeOutBack(cp)) * 260}px) scale(${lerp(.9, 1, easeOut(cp))})`;
    strokeDraw(hLine, easeInOut(prog(t, 1.5, .8)));
    hFill.style.opacity = easeOut(prog(t, 2.2, .35));
    hg.setAttribute("transform", `translate(450 260) scale(${beat(t, 2.45)}) translate(-450 -260)`);
    riseLetters(title.spans, t, 2.3, { dist: 70 });
    fadeUp(sub, t, 2.9);
    rule.style.transform = `scaleX(${easeOut(prog(t, 3.1, .6))})`;
    showLockup(L, t, 3.3);
  };
};

// 2. Heartbeat: vertical stripes drop in, a pulse line traces a white heart, logos on a white bar.
VARIANTS.heartbeat = function () {
  stage.style.background = NAVY;
  const bg = stripes({ width: 135, start: 0, stagger: .06, dur: .75 });
  const svg = fullSvg();
  const cx = 540, cy = 700, tipY = 900;
  const heart = heartPath(cx, cy, 210);
  const lead = `M -40 ${tipY} L 230 ${tipY} L 280 ${tipY - 80} L 330 ${tipY + 90} L 375 ${tipY} L ${cx} ${tipY} `;
  const trail = ` M ${cx} ${tipY} L 700 ${tipY} L 745 ${tipY - 70} L 790 ${tipY + 80} L 830 ${tipY} L 1120 ${tipY}`;
  const traced = lead + heart.replace(/^M [^C]+/, "").replace(/ Z$/, "") + trail;
  const glow = svgEl("filter", { id: "glow", x: "-50%", y: "-50%", width: "200%", height: "200%" }, svg);
  svgEl("feGaussianBlur", { stdDeviation: 12, result: "b" }, glow);
  const m = svgEl("feMerge", {}, glow);
  svgEl("feMergeNode", { in: "b" }, m); svgEl("feMergeNode", { in: "SourceGraphic" }, m);
  const g = svgEl("g", {}, svg);
  const fill = svgEl("path", { d: heart, fill: "#fff" }, g);
  const outline = svgEl("path", { d: heart, fill: "none", stroke: "#fff", "stroke-width": 16, "stroke-linejoin": "round", filter: "url(#glow)" }, g);
  const line = svgEl("path", { d: traced, fill: "none", stroke: "#fff", "stroke-width": 16, "stroke-linecap": "round", "stroke-linejoin": "round", filter: "url(#glow)" }, svg);
  const mini = svgEl("path", { d: heartPath(cx, cy, 70), fill: RED }, g);

  const title = letters(stage, "Go Knights", { position: "absolute", left: 0, right: 0, top: "1010px", textAlign: "center", fontSize: "164px", lineHeight: 1, textShadow: "0 8px 40px rgba(0,0,0,.45)" }, "serif");
  const sub = el("div", { position: "absolute", left: 0, right: 0, top: "1215px", textAlign: "center", fontSize: "38px", textShadow: "0 2px 16px rgba(0,0,0,.5)" }, stage, "With love from Newcastle");
  sub.className = "caps";
  const bar = el("div", { position: "absolute", left: 0, right: 0, top: "1440px", height: "480px", background: "#fff" });
  const L = lockup(bar, 110, { w: 330, h: 230 });

  return t => {
    bg(t);
    strokeDraw(line, easeInOut(prog(t, .7, 2.0)));
    const swap = prog(t, 2.7, .4);
    line.style.opacity = 1 - swap;
    outline.style.opacity = t > 2.7 ? 1 : 0;
    fill.style.opacity = easeOut(prog(t, 2.7, .35));
    mini.style.opacity = easeOut(prog(t, 2.9, .3));
    g.setAttribute("transform", `translate(${cx} ${cy}) scale(${beat(t, 3.1)}) translate(${-cx} ${-cy})`);
    riseLetters(title.spans, t, 3.0);
    fadeUp(sub, t, 3.5);
    bar.style.transform = `translateY(${(1 - easeOut(prog(t, 3.5, .7))) * 100}%)`;
    showLockup(L, t, 3.9);
  };
};

// 3. Hoops: jersey-style horizontal stripes roll in from both sides, big serif type, logos on a white panel.
VARIANTS.hoops = function () {
  stage.style.background = NAVY;
  const bg = stripes({ from: "horizontal", width: 150, start: 0, stagger: .07, dur: .8, drift: 10 });
  const big = el("div", { position: "absolute", left: 0, right: 0, top: "330px", textAlign: "center", fontSize: "270px", lineHeight: .92, textShadow: "0 10px 50px rgba(0,0,0,.45)" }, stage);
  big.className = "serif";
  const w1 = el("div", { overflow: "hidden" }, big), w2 = el("div", { overflow: "hidden", paddingBottom: "20px" }, big);
  const go = el("div", {}, w1, "Go"), kn = el("div", {}, w2, "Knights");
  const hsvg = svgEl("svg", { width: 120, height: 120, viewBox: "-230 -230 460 460", style: "position:absolute;left:480px;top:900px;overflow:visible" }, stage);
  svgEl("path", { d: heartPath(0, -10, 200), fill: "#fff" }, hsvg);
  const panel = el("div", { position: "absolute", left: "60px", right: "60px", top: "1150px", height: "640px", background: "#fff", borderRadius: "44px", boxShadow: "0 30px 80px rgba(0,0,0,.35)" });
  const sub = el("div", { position: "absolute", left: 0, right: 0, top: "90px", textAlign: "center", color: RED, fontSize: "38px" }, panel, "With love from Newcastle");
  sub.className = "caps";
  const L = lockup(panel, 220, { w: 340, h: 270 });

  return t => {
    bg(t);
    go.style.transform = `translateY(${(1 - easeOut(prog(t, 1.2, .7))) * 105}%)`;
    kn.style.transform = `translateY(${(1 - easeOut(prog(t, 1.4, .7))) * 105}%)`;
    const hp = prog(t, 2.0, .55);
    hsvg.style.opacity = clamp(hp * 3);
    hsvg.style.transform = `scale(${easeOutBack(hp) * beat(t, 2.6)})`;
    const pp = prog(t, 2.5, .8);
    panel.style.transform = `translateY(${(1 - easeOutBack(pp)) * 900}px)`;
    fadeUp(sub, t, 3.1);
    showLockup(L, t, 3.3);
  };
};

// 4. Badge: a white seal stamps onto slow-turning stripes, text runs round the rim, logos in the middle.
VARIANTS.badge = function () {
  stage.style.background = NAVY;
  const bg = stripes({ angle: -32, width: 120, start: 0, stagger: .04, dur: .8, drift: 18 });
  const R = 400, cx = 540, cy = 820;
  const svg = fullSvg();
  const seal = svgEl("g", {}, svg);
  svgEl("circle", { cx, cy, r: R, fill: "#fff" }, seal);
  svgEl("circle", { cx, cy, r: R - 26, fill: "none", stroke: RED, "stroke-width": 6 }, seal);
  svgEl("circle", { cx, cy, r: R - 108, fill: "none", stroke: NAVY, "stroke-width": 3, "stroke-opacity": .25 }, seal);
  svgEl("path", { id: "rim", fill: "none", d: `M ${cx - (R - 68)} ${cy} a ${R - 68} ${R - 68} 0 1 1 ${2 * (R - 68)} 0 a ${R - 68} ${R - 68} 0 1 1 ${-2 * (R - 68)} 0` }, seal);
  const ring = svgEl("g", {}, seal);
  const txt = svgEl("text", { fill: NAVY, "font-family": "Brand Sans, Brand Sans Fallback", "font-weight": 800, "font-size": 40, "letter-spacing": 9 }, ring);
  const tp = svgEl("textPath", { href: "#rim", startOffset: "0", textLength: (2 * Math.PI * (R - 68) - 30).toFixed(0), lengthAdjust: "spacing" }, txt);
  tp.textContent = "WITH LOVE FROM NEWCASTLE  ♥  GO KNIGHTS  ♥  ";
  const inner = el("div", { position: "absolute", left: `${cx - 290}px`, top: `${cy - 210}px`, width: "580px", height: "420px" });
  const L = lockup(inner, 10, { w: 250, h: 190 });
  L.box.style.flexDirection = "column"; L.box.style.gap = "0px";
  L.parts[1].style.cssText += "width:220px;height:3px;align-self:center;margin:0";
  const title = letters(stage, "Go Knights", { position: "absolute", left: 0, right: 0, top: "1330px", textAlign: "center", fontSize: "160px", lineHeight: 1, textShadow: "0 8px 40px rgba(0,0,0,.45)" }, "serif");
  const hsvg = svgEl("svg", { width: 90, height: 90, viewBox: "-230 -230 460 460", style: "position:absolute;left:495px;top:1540px;overflow:visible" }, stage);
  svgEl("path", { d: heartPath(0, -10, 200), fill: "#fff" }, hsvg);

  return t => {
    bg(t);
    const sp = prog(t, 1.0, .55);
    const s = sp <= 0 ? 0 : lerp(1.6, 1, easeOut(sp)) - .06 * thump(t, 1.55, .25);
    seal.setAttribute("transform", `translate(${cx} ${cy}) scale(${s}) rotate(${(1 - easeOut(sp)) * -20}) translate(${-cx} ${-cy})`);
    seal.style.opacity = clamp(sp * 4);
    ring.setAttribute("transform", `rotate(${t * 9} ${cx} ${cy})`);
    ring.style.opacity = easeOut(prog(t, 1.5, .6));
    inner.style.opacity = sp > 0 ? 1 : 0;
    showLockup(L, t, 1.8);
    riseLetters(title.spans, t, 2.6);
    const hp = prog(t, 3.2, .5);
    hsvg.style.opacity = clamp(hp * 3);
    hsvg.style.transform = `scale(${easeOutBack(hp) * beat(t, 3.7)})`;
  };
};

// 5. Overlay: transparent end card. A striped ribbon and white card slide up over the last shot.
VARIANTS.overlay = function () {
  const scrim = el("div", { position: "absolute", left: 0, right: 0, bottom: 0, height: "55%", background: "linear-gradient(180deg, rgba(4,12,32,0) 0%, rgba(4,12,32,.6) 100%)" });
  const ribbon = el("div", { position: "absolute", left: "-10%", width: "120%", top: "1060px", height: "200px", overflow: "hidden", transform: "rotate(-4deg)" });
  const rs = el("div", { position: "absolute", inset: 0, background: `repeating-linear-gradient(90deg, ${RED} 0 70px, ${NAVY} 70px 140px)` }, ribbon);
  const card = el("div", { position: "absolute", left: "70px", right: "70px", top: "1150px", height: "640px", background: "#fff", borderRadius: "40px", boxShadow: "0 30px 80px rgba(0,0,0,.35)" });
  const title = letters(card, "Go Knights", { position: "absolute", left: 0, right: 0, top: "60px", textAlign: "center", color: NAVY, fontSize: "136px", lineHeight: 1 }, "serif");
  const sub = el("div", { position: "absolute", left: 0, right: 0, top: "220px", textAlign: "center", color: RED, fontSize: "34px" }, card, "With love from Newcastle");
  sub.className = "caps";
  const L = lockup(card, 320, { w: 300, h: 240 });
  return t => {
    scrim.style.opacity = easeInOut(prog(t, 0, 1));
    ribbon.style.clipPath = `inset(0 ${100 - easeInOut(prog(t, .2, .7)) * 100}% 0 0)`;
    rs.style.transform = `translateX(${-(t * 30) % 140}px)`;
    const cp = prog(t, .6, .75);
    card.style.opacity = clamp(cp * 3);
    card.style.transform = `translateY(${(1 - easeOutBack(cp)) * 300}px)`;
    riseLetters(title.spans, t, 1.1, { dist: 60 });
    fadeUp(sub, t, 1.6);
    showLockup(L, t, 1.9);
  };
};

// 6. Simple: red and blue stripes, a two-tone card with both logos, one tagline.
//    Love's logo is white, so it sits on navy; the Knights logo is full colour,
//    so it sits on white. ?tag= sets the tagline.
VARIANTS.simple = function () {
  stage.style.background = NAVY;
  const bg = stripes({ angle: 0, width: 180, start: 0, stagger: .06, dur: .8, drift: 8 });
  const card = el("div", { position: "absolute", left: "80px", width: "920px", top: "690px", height: "440px", borderRadius: "40px", overflow: "hidden", display: "flex", boxShadow: "0 40px 90px rgba(0,0,0,.4)" });
  // Love's panel. Royal blue is the chosen look; ?lovebg= tries the others.
  const LOVE_BG = {
    plum: "radial-gradient(circle at 55% 50%, #9a55b5 0%, #7a3a93 45%, #4c1d5c 100%)",
    purple: "linear-gradient(135deg, #8a46a6 0%, #6a2f80 100%)",
    royal: "linear-gradient(135deg, #2a62c4 0%, #163f8a 100%)",
    navy: "#071a45",
  };
  const left = el("div", { flex: 1, background: LOVE_BG[params.get("lovebg")] || LOVE_BG.royal, display: "grid", placeItems: "center" }, card);
  const right = el("div", { flex: 1, background: "#fff", display: "grid", placeItems: "center" }, card);
  const love = logoSlot(left, "love", 340, 160, "#fff");
  const kn = logoSlot(right, "knights", 300, 340, NAVY);
  const tag = el("div", { position: "absolute", left: "80px", right: "80px", top: "1200px", textAlign: "center", fontSize: "92px", lineHeight: 1.1, textShadow: "0 6px 30px rgba(0,0,0,.45)" }, stage, params.get("tag") || "Go the Knights");
  tag.className = "serif";
  return t => {
    bg(t);
    const cp = prog(t, .9, .7);
    card.style.opacity = clamp(cp * 3);
    card.style.transform = `translateY(${(1 - easeOutBack(cp)) * 200}px) scale(${lerp(.9, 1, easeOut(cp))})`;
    [love, kn].forEach((n, i) => {
      const q = prog(t, 1.3 + i * .2, .6);
      n.style.opacity = easeOut(q);
      n.style.transform = `scale(${lerp(.7, 1, easeOutBack(q))})`;
    });
    fadeUp(tag, t, 2.1, .9, 40);
  };
};

// ---------- boot ----------
const draw = (VARIANTS[VARIANT] || VARIANTS.card)();
window.draw = draw;
window.DURATION = DURATION;
window.ready = Promise.all([document.fonts.ready, ...pending]).then(() => true);

if (RENDER) {
  document.body.classList.add("render");
  document.documentElement.style.background = "transparent";
  document.getElementById("wrap").style.placeItems = "start";
} else {
  const fit = () => stage.style.transform = `scale(${Math.min(innerWidth / 1080, innerHeight / 1920)})`;
  fit(); addEventListener("resize", fit);
  const picker = document.getElementById("picker");
  Object.keys(VARIANTS).forEach(k => {
    const a = el("a", {}, picker, k);
    const q = new URLSearchParams(location.search); q.set("v", k);
    a.href = "?" + q; if (k === VARIANT) a.className = "on";
  });
  window.ready.then(() => {
    const t0 = performance.now();
    const loop = now => { draw(((now - t0) / 1000) % (DURATION + 1)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
