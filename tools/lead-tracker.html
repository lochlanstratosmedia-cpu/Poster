<title>Meta Lead Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap">
<style>
/* Layout: one quiet column. Text tabs, a stage line, one table of hairline rows; a drawer holds one lead. Colour only where it carries meaning. */
:root {
  --bg: #fbfbfa;
  --surface: #ffffff;
  --hover: #f3f3f1;
  --ink: #161616;
  --ink-2: #5c5c59;
  --muted: #9a9a96;
  --line: #ececea;
  --accent: #161616;
  --accent-ink: #ffffff;
  --scrim: rgba(0, 0, 0, 0.18);
  --shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 16px 48px rgba(0, 0, 0, 0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --r1: #c4c4c0; --r2: #86b6ef; --r3: #3987e5; --r4: #1c5cab; --r5: #104281;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --good-ink: #0a7a0a; --warn-ink: #8a5a00; --serious-ink: #b3471c; --critical-ink: #c02f2f;
  --hot: #c2410c; --warm: #9a6a06; --cold: #5c7a99;
  --f: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Geist Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0c0c; --surface: #141414; --hover: #1a1a1a; --ink: #ececea; --ink-2: #a5a5a1; --muted: #6c6c69; --line: #222221;
    --accent: #ececea; --accent-ink: #0c0c0c; --scrim: rgba(0,0,0,0.5); --shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 16px 48px rgba(0,0,0,0.6);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --r1: #4a4a48; --r2: #184f95; --r3: #2a78d6; --r4: #5598e7; --r5: #9ec5f4;
    --good-ink: #3fc23f; --warn-ink: #f0b030; --serious-ink: #ef9370; --critical-ink: #f07070;
    --hot: #fb8a4c; --warm: #e0b04a; --cold: #8db3da;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0c0c; --surface: #141414; --hover: #1a1a1a; --ink: #ececea; --ink-2: #a5a5a1; --muted: #6c6c69; --line: #222221;
  --accent: #ececea; --accent-ink: #0c0c0c; --scrim: rgba(0,0,0,0.5); --shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 16px 48px rgba(0,0,0,0.6);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --r1: #4a4a48; --r2: #184f95; --r3: #2a78d6; --r4: #5598e7; --r5: #9ec5f4;
  --good-ink: #3fc23f; --warn-ink: #f0b030; --serious-ink: #ef9370; --critical-ink: #f07070;
  --hot: #fb8a4c; --warm: #e0b04a; --cold: #8db3da;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); padding-block: 36px 80px; }
h1, h2, h3 { font-weight: 600; margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
h1 { font-size: 22px; }
h2 { font-size: 15px; }
h3 { font-size: 13px; color: var(--ink-2); font-weight: 500; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.mono { font-family: var(--f-mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; justify-content: space-between; }
header.top .sub { color: var(--muted); margin-top: 2px; }

button { font: inherit; cursor: pointer; color: inherit; }
.btn { padding: 6px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { opacity: 0.88; }
.link { border: 0; background: none; padding: 4px 2px; color: var(--ink-2); font-weight: 500; }
.link:hover { color: var(--ink); }
.btn:disabled { opacity: 0.4; cursor: default; }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; border-radius: 4px; }

input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; min-width: 0; }
input:focus, select:focus, textarea:focus { border-color: var(--muted); outline: none; }
textarea { resize: vertical; width: 100%; }
label.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
label.field > input, label.field > select { width: 100%; }

.tabs { display: flex; gap: 22px; margin-block: 28px 20px; border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 6; overflow-x: auto; }
.tab { padding: 0 0 10px; border: 0; background: none; color: var(--muted); font-weight: 500; border-bottom: 1.5px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--ink); }
.tab .count { color: var(--muted); margin-left: 3px; font-weight: 400; font-variant-numeric: tabular-nums; }

.stages { display: flex; gap: 4px 18px; flex-wrap: wrap; margin-bottom: 18px; }
.stage-btn { border: 0; background: none; padding: 2px 0; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.stage-btn .n { font-variant-numeric: tabular-nums; }
.stage-btn:hover { color: var(--ink-2); }
.stage-btn[aria-pressed="true"] { color: var(--ink); font-weight: 600; }
.stage-btn.zero { opacity: 0.55; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.toolbar input[type="search"] { flex: 1 1 240px; max-width: 360px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); padding: 4px 2px; }
#moreFilters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.bulk { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 0; color: var(--ink-2); }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
#leadTable { min-width: 820px; }
th, td { padding: 11px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; }
th button { background: none; border: 0; padding: 0; color: inherit; font: inherit; }
th button[data-dir]::after { content: attr(data-dir); margin-left: 3px; }
#leadTable tbody tr { cursor: pointer; }
#leadTable tbody tr:hover, #leadTable tbody tr.sel { background: var(--hover); }
td .name { font-weight: 500; }
td .meta { font-size: 12.5px; color: var(--muted); }
.cb { width: 28px; padding-right: 0; }
.cb input { width: 15px; height: 15px; opacity: 0.5; }
tr:hover .cb input, .cb input:checked { opacity: 1; }

.pill { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dot, var(--muted)); flex: none; }
.intent { font-size: 12.5px; white-space: nowrap; }
.intent.hot { color: var(--hot); } .intent.warm { color: var(--warm); } .intent.cold { color: var(--cold); }
.flags { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.flag { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; white-space: nowrap; }
.flag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.flag.critical { color: var(--critical-ink); }
.flag.serious { color: var(--serious-ink); }
.flag.warning { color: var(--warn-ink); }
.deal { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.swatch { width: 7px; height: 7px; border-radius: 2px; background: var(--c); flex: none; }

.empty { padding: 56px 20px; text-align: center; color: var(--muted); }
.empty h3 { margin-bottom: 4px; color: var(--ink); font-size: 14px; }

.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(500px, 100%); background: var(--surface); box-shadow: var(--shadow); z-index: 31; overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 28px) 28px calc(env(safe-area-inset-bottom, 0px) + 48px); display: grid; gap: 28px; align-content: start; }
.drawer:focus { outline: none; }
.drawer .head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.drawer h2 { font-size: 20px; }
.sec { display: grid; gap: 10px; }
.kv { display: grid; grid-template-columns: minmax(90px, 32%) 1fr; gap: 6px 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 10px; }
.history { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.history .when { font-size: 12px; color: var(--muted); }
.history .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.copy { border: 0; background: none; color: var(--ink-2); font-size: 12px; padding: 0 4px; text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--line); }
a.copy { color: var(--ink-2); }

.section { display: grid; gap: 12px; margin-bottom: 44px; }
.section > header { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; justify-content: space-between; }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 44px 56px; margin-bottom: 44px; }
.cols2 > div { display: grid; gap: 14px; align-content: start; min-width: 0; }
.note { font-size: 12.5px; color: var(--muted); margin: 0; max-width: 70ch; }
td.z { color: var(--muted); }
td.bad { color: var(--critical-ink); }
td.warnc { color: var(--warn-ink); }
.facts { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; max-width: 76ch; color: var(--ink-2); }
.hbars { display: grid; gap: 6px; }
.hbar { display: grid; grid-template-columns: minmax(110px, 40%) 1fr 56px; gap: 12px; align-items: center; font-size: 13px; }
.hbar .lab { overflow-wrap: anywhere; color: var(--ink-2); }
.hbar .track { height: 8px; position: relative; }
.hbar .fill { position: absolute; inset: 0 auto 0 0; background: var(--c, var(--ink-2)); border-radius: 0 4px 4px 0; min-width: 2px; }
.hbar .val { text-align: right; font-variant-numeric: tabular-nums; }
.hbar .val small { color: var(--muted); margin-left: 4px; font-size: 11.5px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
details summary { cursor: pointer; color: var(--ink-2); }

.cols { position: relative; height: 170px; margin-left: 26px; margin-bottom: 24px; }
.cols .grid { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
.cols .grid span { position: absolute; left: -26px; top: -8px; width: 20px; text-align: right; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cols .base { position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid var(--muted); }
.cols .bars { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 3px; }
.cols .col { flex: 1; height: 100%; display: flex; flex-direction: column-reverse; gap: 2px; position: relative; min-width: 0; }
.cols .col:hover { background: var(--hover); }
.cols .seg { background: var(--c); }
.cols .col .seg:last-child { border-radius: 3px 3px 0 0; }
.cols .xl { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; }

.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 5px 8px; border-radius: 6px; max-width: 260px; white-space: pre-line; }
.modal { position: fixed; inset: 0; display: grid; place-items: center; z-index: 40; padding: 16px; background: var(--scrim); }
.modal .panel { background: var(--surface); border-radius: 12px; padding: 24px; width: min(400px, 100%); display: grid; gap: 16px; box-shadow: var(--shadow); max-height: 90vh; overflow-y: auto; }
.team-list { list-style: none; padding: 0; margin: 0; display: grid; }
.team-list li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; z-index: 60; max-width: min(480px, calc(100% - 32px)); font-size: 13px; }
.chip-ro { font-size: 12px; color: var(--muted); }
@media (max-width: 640px) { .hbar { grid-template-columns: minmax(90px, 42%) 1fr 50px; } .drawer { padding-inline: 20px; } }
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: slide 0.16s ease-out; }
  @keyframes slide { from { transform: translateX(16px); opacity: 0.7; } to { transform: none; opacity: 1; } }
}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Leads</h1>
      <div class="sub" id="subline">Connecting…</div>
    </div>
    <div class="row">
      <span class="chip-ro" id="roChip" hidden>View only</span>
      <button class="link" id="teamBtn" type="button">Team</button>
      <button class="link" id="exportBtn" type="button" hidden>Export</button>
      <button class="btn primary" id="importBtn" type="button">Import CSV</button>
      <input type="file" id="fileIn" accept=".csv,text/csv" multiple hidden>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="pipeline" aria-selected="true" type="button">Pipeline<span class="count" id="cntAll"></span></button>
    <button class="tab" role="tab" data-tab="team" aria-selected="false" type="button">Accountability<span class="count" id="cntAttn"></span></button>
    <button class="tab" role="tab" data-tab="insights" aria-selected="false" type="button">Insights</button>
  </nav>

  <section id="view-pipeline">
    <div class="stages" id="stages"></div>
    <div class="toolbar">
      <input type="search" id="q" placeholder="Search" aria-label="Search leads">
      <select id="fOwner" aria-label="Owner"></select>
      <label class="toggle"><input type="checkbox" id="fAttn"> Needs attention</label>
      <button class="link" id="moreBtn" type="button" aria-expanded="false">More filters</button>
      <button class="link" id="clearF" type="button">Clear</button>
    </div>
    <div id="moreFilters" hidden>
      <select id="fDeal" aria-label="Deal type"></select>
      <select id="fIntent" aria-label="Intent">
        <option value="">Any intent</option><option value="hot">Hot</option><option value="warm">Warm</option><option value="cold">Cold</option>
      </select>
      <select id="fForm" aria-label="Form"></select>
    </div>
    <div class="bulk" id="bulk" hidden>
      <span id="bulkN"></span>
      <select id="bulkOwner" aria-label="Assign selected to"></select>
      <select id="bulkStage" aria-label="Move selected to stage"></select>
      <button class="link" id="bulkClear" type="button">Cancel</button>
    </div>
    <div class="table-wrap">
      <table id="leadTable">
        <thead><tr>
          <th class="cb"><input type="checkbox" id="selAll" aria-label="Select all shown"></th>
          <th><button data-sort="name" type="button">Name</button></th>
          <th><button data-sort="stage" type="button">Stage</button></th>
          <th><button data-sort="owner" type="button">Owner</button></th>
          <th><button data-sort="nextDue" type="button">Next step</button></th>
          <th><button data-sort="createdTime" type="button">Came in</button></th>
          <th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="tableEmpty" class="empty" hidden></div>
    </div>
  </section>

  <section id="view-team" hidden></section>
  <section id="view-insights" hidden></section>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Lead details"></aside>
<div class="modal" id="teamModal" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="teamTitle">
    <div class="row" style="justify-content:space-between"><h2 id="teamTitle">Team</h2><button class="link" id="teamClose" type="button">Close</button></div>
    <ul class="team-list" id="teamList"></ul>
    <form class="row" id="teamForm">
      <input id="teamName" placeholder="Add a name" aria-label="Team member name" style="flex:1">
      <button class="btn" type="submit">Add</button>
    </form>
  </div>
</div>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DAY = 864e5;

const STAGES = [
  { id: "new", label: "New", hint: "Not contacted yet", step: 0, dot: "var(--r1)" },
  { id: "contacting", label: "Contacting", hint: "Tried, no answer yet", step: 1, dot: "var(--r2)" },
  { id: "active", label: "Active", hint: "In conversation", step: 2, dot: "var(--r3)" },
  { id: "appraisal_booked", label: "Appraisal booked", hint: "Appraisal or site visit booked", step: 3, dot: "var(--r4)" },
  { id: "appraised", label: "Appraised", hint: "Appraisal done", step: 4, dot: "var(--r5)" },
  { id: "started", label: "Started", hint: "Signed on or work under way", step: 5, dot: "var(--good)" },
  { id: "nurture", label: "Nurture", hint: "Not yet, keep in touch", dot: "var(--warm)" },
  { id: "inactive", label: "Inactive", hint: "Gone quiet, no response", dot: "var(--muted)" },
  { id: "lost", label: "Lost", hint: "Not going ahead", dot: "var(--critical)" },
];
const STAGE = Object.fromEntries(STAGES.map((s, i) => [s.id, { ...s, i }]));
const WORKING = new Set(["contacting", "active", "appraisal_booked", "appraised"]);
const DEAL_COLOR = { "Selling": "var(--s1)", "Granny flat": "var(--s2)", "Other": "var(--s3)" };
const DEALS = ["Selling", "Granny flat", "Other"];
const ACT_KINDS = { call: "Call", text: "Text", email: "Email", meeting: "Meeting", note: "Note" };

const store = (() => { try { return window.localStorage; } catch { return null; } })();
const remember = (k, v) => { try { store && store.setItem("mlt." + k, JSON.stringify(v)); } catch {} };
const recall = (k, d) => { try { const v = store && store.getItem("mlt." + k); return v ? JSON.parse(v) : d; } catch { return d; } };

const S = {
  leads: new Map(), team: [], me: null, canWrite: true, db: null, user: null, downloads: null,
  status: "connecting",
  filter: Object.assign({ q: "", deal: "", stage: "", owner: "", intent: "", form: "", attention: false }, recall("filter", {})),
  sort: recall("sort", { key: "createdTime", dir: -1 }),
  selected: new Set(), open: null, tab: recall("tab", "pipeline"), drawerDirty: false,
};

/* ---------- helpers ---------- */
const nowISO = () => new Date().toISOString();
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const todayStr = () => ymd(new Date());
const plural = (n, w, p) => n + " " + (n === 1 ? w : (p || w + "s"));
function ago(iso) {
  if (!iso) return "";
  const ms = Date.now() - Date.parse(iso);
  if (ms < 60e3) return "just now";
  if (ms < 3600e3) return Math.floor(ms / 60e3) + "m ago";
  if (ms < DAY) return Math.floor(ms / 3600e3) + "h ago";
  const d = Math.floor(ms / DAY);
  return d < 60 ? d + "d ago" : Math.floor(d / 30) + "mo ago";
}
const fmtDate = (iso, opts) => iso ? new Date(iso).toLocaleDateString(undefined, opts || { day: "numeric", month: "short" }) : "";
const fmtDateTime = iso => iso ? new Date(iso).toLocaleString(undefined, { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : "";
const fmtDay = s => s ? new Date(s + "T00:00:00").toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }) : "";
function hoursText(h) { if (h < 1) return Math.round(h * 60) + " min"; if (h < 48) return (Math.round(h * 10) / 10) + " h"; return Math.round(h / 24) + " d"; }
function median(a) { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
const pct = (n, d) => d ? Math.round((n / d) * 100) + "%" : "0%";

function phoneLocal(p) {
  let d = String(p || "").replace(/\D/g, "");
  if (d.startsWith("610") && d.length === 12) d = "0" + d.slice(3);
  else if (d.startsWith("61") && d.length === 11) d = "0" + d.slice(2);
  return d;
}
const phoneValid = p => /^0\d{9}$/.test(phoneLocal(p));
function phoneFmt(p) {
  const d = phoneLocal(p);
  if (/^04\d{8}$/.test(d)) return d.replace(/(\d{4})(\d{3})(\d{3})/, "$1 $2 $3");
  if (/^0\d{9}$/.test(d)) return d.replace(/(\d{2})(\d{4})(\d{4})/, "$1 $2 $3");
  return String(p || "");
}

const STREET = new Set("st street rd road ave av avenue cres crs crescent cl close ct crt court cct circuit dr drive pde parade pl place ln lane blvd boulevard gr grove tce terrace way hwy highway".split(" "));
const titleCase = s => s.toLowerCase().replace(/(^|[\s-])([a-z])/g, (m, a, b) => a + b.toUpperCase());
function suburbGuess(address) {
  let a = String(address || "").replace(/\b(nsw|new south wales)\b/gi, " ").replace(/\b\d{4}\b/g, " ").trim();
  if (!a) return "";
  const parts = a.split(",").map(s => s.trim()).filter(s => s.replace(/[^a-z]/gi, "").length > 2);
  let cand = "";
  if (parts.length > 1) cand = parts[parts.length - 1];
  else {
    const words = a.split(/\s+/);
    let idx = -1;
    words.forEach((w, i) => { if (STREET.has(w.toLowerCase().replace(/[.,]/g, ""))) idx = i; });
    if (idx >= 0) cand = words.slice(idx + 1).join(" ");
    else if (!/\d/.test(a)) cand = a;
  }
  cand = cand.replace(/[^A-Za-z' -]/g, " ").replace(/\s+/g, " ").trim();
  return cand ? titleCase(cand) : "";
}
const suburbOf = l => l.suburb || l._suburb || "";

const HOT = ["1 to 3 months", "asap", "immediately", "yes, definitely", "thinking selling", "already considering"];
const COLD = ["just researching", "just exploring", "still deciding", "maybe"];
function autoIntent(l) {
  const t = (l.answers || []).map(a => a.a).join(" | ").toLowerCase();
  if (HOT.some(k => t.includes(k))) return "hot";
  if (COLD.some(k => t.includes(k))) return "cold";
  return "warm";
}
const intentOf = l => l.intent || autoIntent(l);

function flagsOf(l) {
  const out = [], t = Date.now(), today = todayStr();
  const closed = l.stage === "lost" || l.stage === "started";
  if (l.stage === "new" && !l.firstContactAt) {
    const d = Math.floor((t - Date.parse(l.createdTime)) / DAY);
    if (d >= 1) out.push({ lv: "critical", k: "uncontacted", text: "Not contacted · " + d + "d" });
  }
  if (!closed && l.nextDue && l.nextDue < today) out.push({ lv: "serious", k: "overdue", text: "Follow-up overdue" });
  if (WORKING.has(l.stage) && !l.nextDue) out.push({ lv: "warning", k: "nonext", text: "No next step" });
  if (WORKING.has(l.stage)) {
    const last = Date.parse(l.lastTouchAt || l.stageChangedAt || l.createdTime);
    if (t - last > 14 * DAY) out.push({ lv: "warning", k: "stale", text: "No contact in 14d+" });
  }
  if (!l.owner && l.stage !== "lost") out.push({ lv: "warning", k: "unassigned", text: "No owner" });
  return out;
}

function hydrate(id, data) {
  const l = JSON.parse(JSON.stringify(data || {}));
  l.id = id;
  l.stage = STAGE[l.stage] ? l.stage : "new";
  l.answers = Array.isArray(l.answers) ? l.answers : [];
  l.log = Array.isArray(l.log) ? l.log : [];
  l.createdTime = l.createdTime || l.importedAt || nowISO();
  l._suburb = suburbGuess(l.address);
  return l;
}

let toastT;
function toast(msg, ms = 3600) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), ms); }
const tip = $("#tip");
function showTip(el, x, y) { tip.textContent = el.dataset.tip; tip.hidden = false; const r = tip.getBoundingClientRect(); let L = x + 14, T = y + 14; if (L + r.width > innerWidth - 8) L = x - r.width - 14; if (T + r.height > innerHeight - 8) T = y - r.height - 14; tip.style.left = Math.max(8, L) + "px"; tip.style.top = Math.max(8, T) + "px"; }
document.addEventListener("mousemove", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if (el) showTip(el, e.clientX, e.clientY); else tip.hidden = true; });
document.addEventListener("focusin", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if (el) { const r = el.getBoundingClientRect(); showTip(el, r.right, r.top); } });
document.addEventListener("focusout", () => (tip.hidden = true));

/* ---------- writes ---------- */
const queues = new Map();
function enqueue(id, fn) { const p = (queues.get(id) || Promise.resolve()).then(() => fn()); queues.set(id, p.catch(() => {})); return p; }
function writeErr(e) {
  const code = e && e.code;
  if (code === "invalid_argument") { S.canWrite = false; render(); toast("This change wasn't saved. Your access to this tracker is view only; ask the owner for Contributor access."); }
  else if (code === "quota_exceeded") toast("The lead list is full. Delete old leads before adding more.");
  else if (code === "revoked") toast("Access to this tracker changed. Reload the page.");
  else toast("That change didn't save. Check your connection and try again.");
}
function writeLead(id, patch, entry) {
  return enqueue(id, async () => {
    const l = S.leads.get(id);
    if (!l || !S.db) return;
    const at = nowISO();
    const body = { ...patch, updatedAt: at, updatedBy: S.me };
    if (entry) body.log = [...(l.log || []), { at, by: S.me, ...entry }].slice(-200);
    try { await S.db.doc("leads/" + id).update(body); Object.assign(l, body); scheduleRender(); }
    catch (e) { writeErr(e); throw e; }
  });
}
function stagePatch(l, stage) {
  const at = nowISO();
  const p = { stage, stageChangedAt: at, lastTouchAt: at, maxStep: Math.max(l.maxStep || 0, STAGE[stage].step ?? 0) };
  if (stage !== "new" && !l.firstContactAt) p.firstContactAt = at;
  return p;
}
function setStage(id, stage) {
  const l = S.leads.get(id);
  if (!l || l.stage === stage) return Promise.resolve();
  return writeLead(id, stagePatch(l, stage), { kind: "stage", from: l.stage, to: stage, text: "Moved from " + STAGE[l.stage].label + " to " + STAGE[stage].label });
}
function setOwner(id, owner) {
  const l = S.leads.get(id);
  if (!l || (l.owner || "") === owner) return Promise.resolve();
  return writeLead(id, { owner }, { kind: "owner", text: owner ? "Assigned to " + owner : "Owner removed" });
}
function addActivity(id, kind, text) {
  const l = S.leads.get(id);
  if (!l) return Promise.resolve();
  const at = nowISO();
  let patch = {};
  let line = ACT_KINDS[kind] + (text ? ": " + text : "");
  if (kind !== "note") {
    patch.lastTouchAt = at;
    if (!l.firstContactAt) patch.firstContactAt = at;
    if (l.stage === "new") { patch = { ...stagePatch(l, "contacting"), ...patch }; line += " (moved to Contacting)"; }
  }
  return writeLead(id, patch, { kind, text: line });
}
async function runPool(items, n, fn) { let i = 0; const workers = Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) { const it = items[i++]; await fn(it); } }); await Promise.all(workers); }

/* ---------- filtering ---------- */
function matches(l, skipStage) {
  const f = S.filter, q = f.q.trim().toLowerCase();
  if (f.deal && l.dealType !== f.deal) return false;
  if (!skipStage && f.stage && l.stage !== f.stage) return false;
  if (f.owner) { if (f.owner === "__none") { if (l.owner) return false; } else if (l.owner !== f.owner) return false; }
  if (f.intent && intentOf(l) !== f.intent) return false;
  if (f.form && l.form !== f.form) return false;
  if (f.attention && !flagsOf(l).length) return false;
  if (q) {
    const hay = [l.name, l.phone, phoneLocal(l.phone), l.email, l.address, suburbOf(l), l.owner, l.nextAction, l.form, l.campaign].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
const INTENT_ORDER = { hot: 0, warm: 1, cold: 2 };
function sortVal(l, k) {
  switch (k) {
    case "name": return (l.name || "").toLowerCase();
    case "stage": return STAGE[l.stage].i;
    case "intent": return INTENT_ORDER[intentOf(l)];
    case "suburb": return suburbOf(l).toLowerCase() || "\uffff";
    case "owner": return (l.owner || "\uffff").toLowerCase();
    case "nextDue": return l.nextDue || "\uffff";
    case "dealType": return l.dealType || "";
    default: return l.createdTime || "";
  }
}
function visible() {
  const { key, dir } = S.sort;
  return [...S.leads.values()].filter(l => matches(l)).sort((a, b) => {
    const x = sortVal(a, key), y = sortVal(b, key);
    if (x < y) return -dir; if (x > y) return dir;
    return (b.createdTime || "").localeCompare(a.createdTime || "");
  });
}

    const fh = ls.filter(l => l.firstContactAt).map(l => (Date.parse(l.firstContactAt) - Date.parse(l.createdTime)) / 36e5).filter(h => h >= 0);
    const last = ls.reduce((m, l) => (l.lastTouchAt && l.lastTouchAt > m ? l.lastTouchAt : m), "");
    return {
      o, n: ls.length,
      unc: ls.filter(l => l.stage === "new" && !l.firstContactAt).length,
      overdue: ls.filter(l => l.nextDue && l.nextDue < today && !["lost", "started"].includes(l.stage)).length,
      slip: ls.filter(l => flagsOf(l).some(f => f.k === "stale" || f.k === "nonext")).length,
      med: median(fh), appr: ls.filter(l => (l.maxStep || 0) >= 3).length, started: ls.filter(l => l.stage === "started").length, last,
    };
  }).filter(r => r.n || r.o);
  const cell = (n, cls) => `<td class="num ${n ? cls : "z"}">${n}</td>`;
  const ownerTable = `<div class="table-wrap"><table style="min-width:760px"><thead><tr>
      <th>Owner</th><th>Leads</th><th data-tip="Stage is New with no contact logged">Not contacted</th><th>Overdue</th><th data-tip="Working leads with no next step, or no contact in 14 days">Slipping</th><th data-tip="Median time from the form coming in to first contact">First contact</th><th>Appraised</th><th>Started</th><th>Last contact</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td><button class="link" style="padding:0;color:var(--ink)" type="button" data-owner="${esc(r.o || "__none")}">${esc(r.o || "No owner")}</button></td><td class="num">${r.n}</td>${cell(r.unc, "bad")}${cell(r.overdue, "bad")}${cell(r.slip, "warnc")}<td class="num">${r.med == null ? '<span class="muted">None</span>' : hoursText(r.med)}</td><td class="num">${r.appr}</td><td class="num">${r.started}</td><td>${r.last ? esc(ago(r.last)) : '<span class="muted">Never</span>'}</td></tr>`).join("")}
    </tbody></table></div>`;

  const weekAgo = Date.now() - 7 * DAY;
  const byPerson = new Map();
  for (const l of all) for (const e of l.log || []) {
    if (!e.by || Date.parse(e.at) < weekAgo) continue;
    const r = byPerson.get(e.by) || { contacts: 0, stages: 0, leads: new Set() };
    if (["call", "text", "email", "meeting"].includes(e.kind)) r.contacts++; else if (e.kind === "stage") r.stages++;
    r.leads.add(l.id); byPerson.set(e.by, r);
  }
  const activity = byPerson.size ? `<div class="table-wrap"><table><thead><tr><th>Person</th><th>Leads touched</th><th>Contacts logged</th><th>Stage moves</th></tr></thead><tbody>
      ${[...byPerson.entries()].sort((a, b) => b[1].leads.size - a[1].leads.size).map(([id, r]) => `<tr><td><span data-uid="${esc(id)}">…</span></td><td class="num">${r.leads.size}</td><td class="num">${r.contacts}</td><td class="num">${r.stages}</td></tr>`).join("")}
    </tbody></table></div>` : `<p class="note">No updates in the last 7 days.</p>`;

  const rank = { critical: 0, serious: 1, warning: 2 };
  const flagged = all.filter(l => flagsOf(l).length).sort((a, b) => {
    const w = l => Math.min(...flagsOf(l).map(f => rank[f.lv]));
    return w(a) - w(b) || (INTENT_ORDER[intentOf(a)] - INTENT_ORDER[intentOf(b)]) || b.createdTime.localeCompare(a.createdTime);

  const leadRow = l => `<tr data-open="${esc(l.id)}" style="cursor:pointer"><td><div class="name">${esc(l.name || "No name")}</div><div class="meta">${esc([suburbOf(l), l.dealType].filter(Boolean).join(" · "))}</div></td><td>${esc(l.owner || "")}${l.owner ? "" : '<span class="muted">No owner</span>'}</td><td><div class="flags">${flagTags(l)}</div></td></tr>`;

  v.innerHTML = `
    <div class="section"><header><h2>By owner</h2></header>${ownerTable}</div>
    <div class="section"><header><h2>Call first</h2><span class="muted">Hot leads still at New</span></header>

    </div>
    <div class="section"><header><h2>Activity</h2><span class="muted">Last 7 days</span></header>${activity}</div>
    <div class="section"><header><h2>Needs attention</h2><span class="muted">${flagged.length}</span></header>
      ${flagged.length ? `<div class="table-wrap"><table><tbody>${flagged.slice(0, 60).map(leadRow).join("")}</tbody></table></div>${flagged.length > 60 ? `<p class="note">Showing 60. Use the Needs attention filter on Pipeline for the rest.</p>` : ""}` : `<p class="note">Nothing needs attention.</p>`}
    </div>`;
  resolveNames(v);
}

/* ---------- insights ---------- */
function hbars(items, opts = {}) {
  const max = Math.max(1, ...items.map(i => i.v));
  const total = opts.total;
  return `<div class="hbars">${items.map(i => `<div class="hbar" data-tip="${esc(i.l + ": " + i.v + (total ? " of " + total : ""))}"><span class="lab">${esc(i.l)}</span><span class="track"><span class="fill" style="width:${(i.v / max) * 100}%;--c:${i.c || opts.c || "var(--ink-2)"}"></span></span><span class="val">${i.v}${total ? `<small>${pct(i.v, total)}</small>` : ""}</span></div>`).join("")}</div>`;
}
function countBy(arr, fn) { const m = new Map(); for (const x of arr) { const k = fn(x); if (k == null || k === "") continue; m.set(k, (m.get(k) || 0) + 1); } return [...m.entries()].sort((a, b) => b[1] - a[1]); }
function niceMax(v) { if (v <= 5) return 5; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
function weekStart(t) { const x = new Date(t); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }

function weeklyChart(all, deals) {
  const first = weekStart(Math.min(...all.map(l => Date.parse(l.createdTime))));
  const last = weekStart(Date.now());
  const weeks = [];
  for (let d = new Date(first); d <= last; d.setDate(d.getDate() + 7)) weeks.push(new Date(d));
  const data = weeks.map(w => { const end = w.getTime() + 7 * DAY; const ls = all.filter(l => { const t = Date.parse(l.createdTime); return t >= w.getTime() && t < end; }); return { w, ls, by: deals.map(d => ls.filter(l => l.dealType === d).length) }; });
  const max = niceMax(Math.max(1, ...data.map(d => d.ls.length)));
  const every = Math.ceil(weeks.length / 6);
  const wk = w => w.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  return `<div class="legend">${deals.map(d => `<span><i class="swatch" style="--c:${DEAL_COLOR[d]}"></i>${esc(d)}</span>`).join("")}</div>
    <div class="cols" role="img" aria-label="Leads per week by deal type">
      <div class="grid" style="bottom:50%"><span>${max / 2}</span></div><div class="grid" style="bottom:100%"><span>${max}</span></div>
      <div class="base"><span style="position:absolute;left:-26px;top:-8px;width:20px;text-align:right;font-size:11px;color:var(--muted)">0</span></div>
      <div class="bars">${data.map((d, i) => `<div class="col" tabindex="0" data-tip="${esc("Week of " + wk(d.w) + ": " + plural(d.ls.length, "lead") + (d.ls.length ? "\n" + deals.map((x, j) => x + " " + d.by[j]).join(" · ") : ""))}">
        ${deals.map((x, j) => d.by[j] ? `<div class="seg" style="height:calc(${(d.by[j] / max) * 100}% - 2px);--c:${DEAL_COLOR[x]}"></div>` : "").join("")}
        ${i % every === 0 ? `<span class="xl">${esc(wk(d.w))}</span>` : ""}</div>`).join("")}</div>
    </div>`;
}

function renderInsights() {
  const v = $("#view-insights");
  const all = [...S.leads.values()];
  if (S.status !== "ready") { v.innerHTML = `<div class="empty">Loading…</div>`; return; }
  if (!all.length) { v.innerHTML = `<div class="empty"><h3>Nothing to show yet</h3><p>Import a Meta CSV first.</p></div>`; return; }
  const T = all.length;
  const deals = DEALS.filter(d => all.some(l => l.dealType === d));

  const facts = [];
  facts.push(countBy(all, l => l.dealType).map(([d, n]) => `${pct(n, T)} ${d.toLowerCase()}`).join(", ") + ` (${T} leads).`);
  const plat = countBy(all, l => l.platform === "ig" ? "Instagram" : l.platform === "fb" ? "Facebook" : null);
  if (plat.length) facts.push(plat.map(([p, n]) => `${n} from ${p}`).join(", ") + ".");
  facts.push(countBy(all, intentOf).map(([i, n]) => `${n} ${i}`).join(", ") + " by their answers.");
  const qGroups = new Map();
  for (const l of all) for (const a of l.answers) { if (!a.a) continue; if (!qGroups.has(a.q)) qGroups.set(a.q, []); qGroups.get(a.q).push(a.a); }
  for (const [q, vals] of qGroups) {
    const c = countBy(vals, x => x);
    if (vals.length < 3 || c.length > 10 || c.length === vals.length) continue;
    facts.push(`${q.replace(/\?$/, "")}: "${c[0][0]}" is the top answer (${c[0][1]} of ${vals.length}).`);
  }
  const subs = countBy(all, l => suburbOf(l));
  if (subs.length) facts.push(`Top suburbs: ${subs.slice(0, 4).map(([s, n]) => `${s} (${n})`).join(", ")}.`);
  const DOW = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const dow = countBy(all, l => DOW[new Date(l.createdTime).getDay()]);
  const bands = [["midnight and 6am", 0, 6], ["6am and 9am", 6, 9], ["9am and noon", 9, 12], ["noon and 3pm", 12, 15], ["3pm and 6pm", 15, 18], ["6pm and 9pm", 18, 21], ["9pm and midnight", 21, 24]];
  const bandCounts = countBy(all, l => { const h = new Date(l.createdTime).getHours(); return bands.find(b => h >= b[1] && h < b[2])[0]; });
  facts.push(`Most forms come in on ${dow[0][0]}s and between ${bandCounts[0][0]}.`);

  const funnel = STAGES.filter(s => s.step != null).map(s => ({ l: s.label, v: all.filter(l => (l.maxStep || 0) >= s.step).length, c: s.dot }));
  const camps = countBy(all, l => l.campaign).map(([c]) => { const ls = all.filter(l => l.campaign === c); return { c, n: ls.length, hot: ls.filter(l => intentOf(l) === "hot").length, con: ls.filter(l => l.firstContactAt).length, a: ls.filter(l => (l.maxStep || 0) >= 3).length, s: ls.filter(l => l.stage === "started").length }; });

  const answerBlocks = countBy(all, l => l.form).map(([f]) => {
    const ls = all.filter(l => l.form === f);
    const qs = [];
    for (const l of ls) for (const a of l.answers) if (!qs.includes(a.q)) qs.push(a.q);
    const blocks = qs.map(q => {
      const vals = ls.map(l => (l.answers.find(a => a.q === q) || {}).a).filter(Boolean);
      const c = countBy(vals, x => x);
      if (!vals.length || c.length > 10 || (c.length === vals.length && vals.length > 3)) return "";
      return `<div class="sec"><h3>${esc(q)}</h3>${hbars(c.map(([l, n]) => ({ l, v: n })), { total: vals.length, c: DEAL_COLOR[ls[0].dealType] })}</div>`;
    }).join("");
    return blocks ? `<div><h2>${esc(f)} <span class="muted" style="font-weight:400">${ls.length}</span></h2>${blocks}</div>` : "";
  }).join("");

  const issues = [];
  const seenPhone = new Map(), seenEmail = new Map();
  for (const l of [...all].sort((a, b) => a.createdTime.localeCompare(b.createdTime))) {
    const p = phoneLocal(l.phone), e = (l.email || "").toLowerCase();
    if (l.phone && !phoneValid(l.phone)) issues.push([l, `Phone "${l.phone}" isn't a valid number`]);
    if (!l.phone) issues.push([l, "No phone"]);
    if (/no calls|don'?t call|do not call/i.test(l.name || "")) issues.push([l, "Name says no calls"]);
    if (l.address && !/\d/.test(l.address)) issues.push([l, `Partial address: "${l.address}"`]);
    if (p && phoneValid(l.phone) && seenPhone.has(p)) issues.push([l, `Same phone as ${seenPhone.get(p).name}`]);
    else if (e && seenEmail.has(e)) issues.push([l, `Same email as ${seenEmail.get(e).name}`]);
    if (p) seenPhone.set(p, l); if (e) seenEmail.set(e, l);
  }

  const wasOpen = !!(v.querySelector("details") || {}).open;
  v.innerHTML = `
    <div class="section"><header><h2>In common</h2></header>
      <ul class="facts">${facts.map(f => `<li>${esc(f)}</li>`).join("")}</ul>
      <p class="note">Hot: "1 to 3 months", "Yes, definitely", "Already considering it". Cold: "Just researching", "Just exploring", "Still deciding", "Maybe". Everything else is warm.</p>
    </div>
    <div class="cols2">
      <div><h2>Leads per week</h2>${weeklyChart(all, deals)}</div>
      <div><h2>Furthest stage reached</h2>${hbars(funnel, { total: T })}</div>
    </div>
    <div class="section"><header><h2>Campaigns</h2></header>
      <div class="table-wrap"><table style="min-width:640px"><thead><tr><th>Campaign</th><th>Leads</th><th>Hot</th><th>Contacted</th><th>Appraised</th><th>Started</th></tr></thead><tbody>
      ${camps.map(r => `<tr><td>${esc(r.c)}</td><td class="num">${r.n}</td><td class="num">${r.hot}</td><td class="num">${r.con}</td><td class="num">${r.a}</td><td class="num">${r.s}</td></tr>`).join("")}
      </tbody></table></div></div>
    <div class="cols2">${answerBlocks}</div>
    <div class="section"><details><summary>${plural(issues.length, "record")} to check</summary>
      <div class="table-wrap" style="margin-top:10px"><table><tbody>${issues.map(([l, t]) => `<tr data-open="${esc(l.id)}" style="cursor:pointer"><td class="name">${esc(l.name || "No name")}</td><td class="ink2">${esc(t)}</td></tr>`).join("")}</tbody></table></div>
    </details></div>`;
  if (wasOpen) v.querySelector("details").open = true;
}

/* ---------- import / export ---------- */
function parseCSV(text, delim) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}
async function readText(file) {
  const buf = await file.arrayBuffer(); const b = new Uint8Array(buf);
  if (b[0] === 0xff && b[1] === 0xfe) return new TextDecoder("utf-16le").decode(buf);
  if (b[0] === 0xfe && b[1] === 0xff) return new TextDecoder("utf-16be").decode(buf);
  return new TextDecoder("utf-8").decode(buf).replace(/^\uFEFF/, "");
}
const META_COLS = new Set(["id", "created_time", "ad_id", "ad_name", "adset_id", "adset_name", "campaign_id", "campaign_name", "form_id", "form_name", "is_organic", "platform", "lead_status"]);
const qLabel = c => { const s = c.replace(/_/g, " ").trim(); return s.charAt(0).toUpperCase() + s.slice(1); };
const dealFromForm = f => /granny/i.test(f) ? "Granny flat" : /sell|market|strat|apprais|hold|valu/i.test(f) ? "Selling" : "Other";
function rowToLead(h, r, file, at) {
  const doc = { answers: [], name: "", phone: "", email: "", address: "" };
  const get = k => { const i = h.indexOf(k); return i < 0 ? "" : String(r[i] ?? "").trim(); };
  h.forEach((col, i) => {
    const v = String(r[i] ?? "").trim();
    if (META_COLS.has(col)) return;
    if (col === "full_name" || col === "name") doc.name = v;
    else if (col === "phone" || col === "phone_number") doc.phone = v.replace(/^p:/, "");
    else if (col === "email") doc.email = v;
    else if (col.includes("address")) doc.address = v;
    else if (col) doc.answers.push({ q: qLabel(col), a: v });
  });
  const metaId = get("id").replace(/^l:/, "");
  const created = Date.parse(get("created_time"));
  const form = get("form_name");
  return Object.assign(doc, {
    metaId, createdTime: isNaN(created) ? at : new Date(created).toISOString(), form,
    campaign: get("campaign_name"), adset: get("adset_name"), ad: get("ad_name"), platform: get("platform"),
    dealType: dealFromForm(form), stage: "new", owner: "", nextAction: "", nextDue: "", appraisalDate: "",
    firstContactAt: null, lastTouchAt: null, stageChangedAt: at, importedAt: at, updatedAt: at,
    log: [{ at, by: S.me, kind: "import", text: "Imported from " + file }],
  });
}
async function importFiles(files) {
  if (!S.db || !S.canWrite) return;
  const at = nowISO();
  const fresh = new Map(); let skipped = 0, bad = 0;
  for (const file of files) {
    const text = await readText(file);
    const first = text.split("\n", 1)[0];
    const delim = (first.match(/\t/g) || []).length > (first.match(/,/g) || []).length ? "\t" : ",";
    const rows = parseCSV(text, delim);
    if (!rows.length) continue;
    const h = rows[0].map(c => c.trim().toLowerCase());
    if (!h.includes("id") || !h.includes("created_time")) { toast(file.name + " doesn't look like a Meta lead export (no id or created_time column)."); continue; }
    for (const r of rows.slice(1)) {
      const doc = rowToLead(h, r, file.name, at);
      const id = doc.metaId.replace(/[^A-Za-z0-9_\-.~:@+]/g, "_");
      if (!id) { bad++; continue; }
      if (S.leads.has(id) || fresh.has(id)) { skipped++; continue; }
      fresh.set(id, doc);
    }
  }
  if (!fresh.size) { toast(skipped ? `No new leads. All ${skipped} are already in the tracker.` : "No leads found in that file."); return; }
  toast(`Adding ${plural(fresh.size, "lead")}…`, 60000);
  let ok = 0, failed = 0;
  await runPool([...fresh.entries()], 4, async ([id, doc]) => { try { await S.db.doc("leads/" + id).set(doc); ok++; } catch (e) { failed++; if (failed === 1) writeErr(e); } });
  toast(`Added ${plural(ok, "new lead")}` + (skipped ? `, skipped ${skipped} already here` : "") + (failed ? `, ${failed} failed` : "") + (bad ? `, ${bad} rows had no id` : "") + ".", 6000);
}
function csvCell(v) { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
async function exportCSV() {
  const cols = ["Name", "Phone", "Email", "Address", "Suburb", "Deal type", "Form", "Campaign", "Came in", "Stage", "Owner", "Next step", "Next step due", "Appraisal date", "First contact", "Last contact", "Intent", "Flags", "Meta lead id"];
  const rows = visible().map(l => [l.name, phoneFmt(l.phone), l.email, l.address, suburbOf(l), l.dealType, l.form, l.campaign, fmtDateTime(l.createdTime), STAGE[l.stage].label, l.owner, l.nextAction, l.nextDue, l.appraisalDate, fmtDateTime(l.firstContactAt), fmtDateTime(l.lastTouchAt), intentOf(l), flagsOf(l).map(f => f.text).join("; "), l.metaId || l.id]);
  const data = [cols, ...rows].map(r => r.map(csvCell).join(",")).join("\n");
  try { await S.downloads.save({ filename: "leads-" + todayStr() + ".csv", data }); }
  catch (e) { if (e && e.code !== "declined") toast("The export couldn't be saved here."); }
}

document.addEventListener("click", async e => {
  const t = e.target;
  const tab = t.closest(".tab");
  if (tab) { S.tab = tab.dataset.tab; remember("tab", S.tab); render(); return; }
  if (t.closest("[data-close]") || t === $("#scrim")) { closeLead(); return; }
  const cp = t.closest("[data-copy]");
  if (cp) { const v = cp.dataset.copy; try { await navigator.clipboard.writeText(v); toast("Copied " + v); } catch { toast(v); } return; }
  if (t.closest("[data-clear]") || t.closest("#clearF")) { S.filter = { q: "", deal: "", stage: "", owner: "", intent: "", form: "", attention: false }; remember("filter", S.filter); render(); return; }
  const sb = t.closest(".stage-btn");
  if (sb) { S.filter.stage = S.filter.stage === sb.dataset.stage ? "" : sb.dataset.stage; remember("filter", S.filter); render(); return; }
  const so = t.closest("th button[data-sort]");
  if (so) { const k = so.dataset.sort; S.sort = S.sort.key === k ? { key: k, dir: -S.sort.dir } : { key: k, dir: k === "createdTime" ? -1 : 1 }; remember("sort", S.sort); render(); return; }
  const ow = t.closest("[data-owner]");
  if (ow) { S.filter = { q: "", deal: "", stage: "", owner: ow.dataset.owner, intent: "", form: "", attention: false }; S.tab = "pipeline"; remember("tab", S.tab); remember("filter", S.filter); render(); return; }
  const op = t.closest("[data-open]");
  if (op) { openLead(op.dataset.open); return; }
  if (t.matches("input[data-sel]")) { t.checked ? S.selected.add(t.dataset.sel) : S.selected.delete(t.dataset.sel); render(); return; }
  if (t.closest(".cb")) return;
  const tr = t.closest("#rows tr");
  if (tr) { openLead(tr.dataset.id); return; }
});

}
$("#bulkOwner").addEventListener("change", e => { const v = e.target.value; if (!v) return; bulk(id => setOwner(id, v === "__none" ? "" : v), "Updating"); });
$("#bulkStage").addEventListener("change", e => { const v = e.target.value; if (!v) return; bulk(id => setStage(id, v), "Moving"); });

let qT;
$("#q").addEventListener("input", e => { clearTimeout(qT); qT = setTimeout(() => { S.filter.q = e.target.value; remember("filter", S.filter); render(); }, 120); });
for (const [id, key] of [["#fDeal", "deal"], ["#fOwner", "owner"], ["#fIntent", "intent"], ["#fForm", "form"]]) $(id).addEventListener("change", e => { S.filter[key] = e.target.value; remember("filter", S.filter); render(); });
$("#fAttn").addEventListener("change", e => { S.filter.attention = e.target.checked; remember("filter", S.filter); render(); });
$("#moreBtn").addEventListener("click", () => { const m = $("#moreFilters"); m.hidden = !m.hidden; $("#moreBtn").setAttribute("aria-expanded", String(!m.hidden)); });

$("#drawer").addEventListener("change", async e => {
  const id = S.open; if (!id) return;
  if (e.target.id === "dStage") { try { await setStage(id, e.target.value); toast("Stage saved"); } catch {} return; }
  if (e.target.id === "dOwner") { try { await setOwner(id, e.target.value); toast("Owner saved"); } catch {} return; }
});
$("#drawer").addEventListener("input", e => { if (e.target.closest("#dDetails")) { S.drawerDirty = true; $("#dSave").disabled = false; $("#dSaveNote").textContent = "Unsaved changes"; } });
$("#drawer").addEventListener("click", async e => {
  const id = S.open; if (!id) return;
  if (e.target.id === "dSave") {
    const l = S.leads.get(id);
    const next = { nextAction: $("#dNext").value.trim(), nextDue: $("#dDue").value, appraisalDate: $("#dAppr").value, dealType: $("#dDeal").value, intent: $("#dIntent").value };
    const sub = $("#dSuburb").value.trim();
    next.suburb = sub && sub !== l._suburb ? sub : "";
    const patch = {}, notes = [];
    for (const [k, v] of Object.entries(next)) if ((l[k] || "") !== v) patch[k] = v;
    if (!Object.keys(patch).length) { S.drawerDirty = false; fillDetails(l); return; }
    if ("nextAction" in patch || "nextDue" in patch) notes.push(next.nextAction ? "Next step: " + next.nextAction + (next.nextDue ? " (due " + fmtDay(next.nextDue) + ")" : "") : "Next step cleared");
    if ("appraisalDate" in patch) notes.push(next.appraisalDate ? "Appraisal date set to " + fmtDay(next.appraisalDate) : "Appraisal date cleared");
    if ("dealType" in patch) notes.push("Deal type changed to " + next.dealType);
    if ("intent" in patch) notes.push(next.intent ? "Intent set to " + next.intent : "Intent back to form answers");
    if ("suburb" in patch) notes.push("Suburb set to " + (next.suburb || l._suburb || "blank"));
    if (next.appraisalDate && "appraisalDate" in patch && STAGE[l.stage].step != null && STAGE[l.stage].step < 3) Object.assign(patch, stagePatch(l, "appraisal_booked")), notes.push("Moved to Appraisal booked");
    e.target.disabled = true;
    try { await writeLead(id, patch, { kind: "detail", text: notes.join(". ") }); S.drawerDirty = false; fillDetails(S.leads.get(id)); toast("Details saved"); renderDrawer(false); }
    catch { e.target.disabled = false; }
    return;
  }
  if (e.target.id === "dActBtn") {
    const kind = ($("#drawer input[name=actKind]:checked") || {}).value || "call";
    const text = $("#dAct").value.trim();
    if (kind === "note" && !text) { toast("Write the note first."); return; }
    e.target.disabled = true;
    try { await addActivity(id, kind, text); $("#dAct").value = ""; toast("Added to history"); } catch {}
    e.target.disabled = false;
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("#teamModal").hidden) $("#teamModal").hidden = true; else if (S.open) closeLead(); } });

$("#importBtn").addEventListener("click", () => $("#fileIn").click());
$("#fileIn").addEventListener("change", async e => { const fs = [...e.target.files]; e.target.value = ""; if (fs.length) await importFiles(fs); });
document.addEventListener("dragover", e => { if (S.canWrite && S.db) e.preventDefault(); });
document.addEventListener("drop", async e => { if (!S.canWrite || !S.db) return; e.preventDefault(); const fs = [...(e.dataTransfer?.files || [])].filter(f => /\.csv$/i.test(f.name)); if (fs.length) await importFiles(fs); });
$("#exportBtn").addEventListener("click", exportCSV);

function renderTeamModal() {
  $("#teamList").innerHTML = S.team.length ? S.team.map((n, i) => `<li><span>${esc(n)} <span class="muted">· ${plural([...S.leads.values()].filter(l => l.owner === n).length, "lead")}</span></span>${S.canWrite ? `<button class="btn ghost small" type="button" data-rm="${i}">Remove</button>` : ""}</li>`).join("") : `<li class="muted">No one yet. Add the people who work these leads.</li>`;
  $("#teamForm").hidden = !S.canWrite;
}
$("#teamBtn").addEventListener("click", () => { renderTeamModal(); $("#teamModal").hidden = false; $("#teamName").focus(); });
$("#teamClose").addEventListener("click", () => ($("#teamModal").hidden = true));
$("#teamModal").addEventListener("click", async e => {
  if (e.target === $("#teamModal")) { $("#teamModal").hidden = true; return; }
  const rm = e.target.closest("[data-rm]");
  if (rm) { const team = S.team.filter((_, i) => i !== +rm.dataset.rm); await saveTeam(team); }
});
$("#teamForm").addEventListener("submit", async e => {
  e.preventDefault();
  const n = $("#teamName").value.trim(); if (!n) return;
  if (S.team.some(x => x.toLowerCase() === n.toLowerCase())) { toast(n + " is already on the team."); return; }
  await saveTeam([...S.team, n]); $("#teamName").value = "";
});
let teamQ = Promise.resolve();
function saveTeam(team) {
  teamQ = teamQ.then(async () => { try { await S.db.doc("config/team").set({ members: team, updatedAt: nowISO(), updatedBy: S.me }); S.team = team; renderTeamModal(); render(); } catch (e) { writeErr(e); } });
  return teamQ;
}

/* ---------- boot ---------- */
render();
(async () => {
  const use = n => (window.claude && typeof window.claude.use === "function") ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [db, user, downloads] = await Promise.all([use("db"), use("user"), use("downloads")]);
  S.user = user; S.downloads = downloads;
  if (!db) { S.status = "nodb"; render(); return; }
  S.db = db;
  if (user) { S.me = await user.id(); const cw = await user.can("data.write"); S.canWrite = cw !== false; }
  db.collection("leads").onSnapshot(snap => {
    for (const ch of snap.docChanges()) {
      if (ch.type === "removed") S.leads.delete(ch.doc.id);
      else S.leads.set(ch.doc.id, hydrate(ch.doc.id, ch.doc.data()));
    }
    if (!snap.metadata.fromCache || snap.size) S.status = "ready";
    scheduleRender();
  }, err => { toast(err && err.code === "revoked" ? "Access to this tracker changed. Reload the page." : "Lost the connection to the lead list. Reload the page."); });
  db.doc("config/team").onSnapshot(s => { const d = s.exists ? s.data() : null; S.team = d && Array.isArray(d.members) ? [...d.members] : []; scheduleRender(); if (!$("#teamModal").hidden) renderTeamModal(); });
  setTimeout(() => { if (S.status === "connecting") { S.status = "ready"; scheduleRender(); } }, 8000);
})();
})();
</script>
