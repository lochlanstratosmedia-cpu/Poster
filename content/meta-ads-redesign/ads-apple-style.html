<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#777;display:flex;flex-wrap:wrap;gap:40px;padding:40px}
.ad{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:Inter,sans-serif;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;text-align:center}
.eyebrow{font-size:38px;font-weight:600;letter-spacing:-.01em}
.hero{font-weight:700;letter-spacing:-.045em;line-height:.92}
.sub{font-weight:600;letter-spacing:-.025em;line-height:1.08}
.grad-light{background:linear-gradient(135deg,#9F86C8 0%,#5B3F7E 55%,#392B3D 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.grad-dark{background:linear-gradient(180deg,#FFFFFF 0%,#D9D0E6 45%,#9E8BB8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;height:104px;padding:0 64px;border-radius:999px;font-size:38px;font-weight:500;letter-spacing:-.01em}
.small{font-size:32px;font-weight:400;letter-spacing:-.005em}
.chev{display:inline-block;width:.5em;height:.5em;border-right:3px solid currentColor;border-top:3px solid currentColor;transform:rotate(45deg);margin-left:.3em;vertical-align:.08em}
.photo{position:absolute;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.tile{position:absolute;border-radius:48px;overflow:hidden}
</style>
</head>
<body>

<!-- A · light product page -->
<section class="ad" id="apple-a-light" style="background:#F5F5F7;color:#1D1D1F">
  <div style="position:absolute;left:0;right:0;top:250px">
    <div class="eyebrow" style="color:#7B5CA8">Postcode</div>
    <div class="hero grad-light" style="font-size:330px;margin-top:6px">2287</div>
    <div class="sub" style="font-size:76px;margin-top:34px">Find out where<br>your home sits.</div>
    <div style="margin-top:56px"><span class="btn" style="background:#7B5CA8;color:#fff">Book a Chat</span></div>
    <div class="small" style="margin-top:30px;color:#6E6E73">No Cost. No Commitment.</div>
  </div>
  <div class="photo" style="left:90px;right:90px;top:1180px;height:820px;border-radius:56px;box-shadow:0 40px 80px rgba(0,0,0,.12)"><img src="photos/house-colour.jpg" style="object-position:50% 45%"></div>
</section>

<!-- B · dark pro page -->
<section class="ad" id="apple-b-dark" style="background:#000;color:#F5F5F7">
  <div class="photo" style="left:0;right:0;top:1060px;height:860px"><img src="photos/house-colour.jpg" style="object-position:50% 40%;filter:brightness(.82) saturate(.9)"></div>
  <div style="position:absolute;left:0;right:0;top:1060px;height:860px;background:linear-gradient(180deg,#000 0%,rgba(0,0,0,.55) 22%,rgba(0,0,0,0) 45%,rgba(0,0,0,0) 70%,rgba(0,0,0,.6) 100%)"></div>
  <div style="position:absolute;left:0;right:0;top:250px">
    <div class="eyebrow" style="color:#A1A1A6">Postcode</div>
    <div class="hero grad-dark" style="font-size:340px;margin-top:6px">2287</div>
    <div class="sub" style="font-size:72px;margin-top:30px;color:#F5F5F7">Find out where<br>your home sits.</div>
    <div style="margin-top:52px"><span class="btn" style="background:#C2ADE0;color:#1D1D1F">Book a Chat</span></div>
    <div class="small" style="margin-top:28px;color:#A1A1A6">No Cost. No Commitment.</div>
  </div>
</section>

<!-- C · bento grid -->
<section class="ad" id="apple-c-bento" style="background:#F5F5F7;color:#1D1D1F">
  <div class="tile" style="left:60px;right:60px;top:240px;height:520px;background:#fff;box-shadow:0 2px 20px rgba(0,0,0,.04)">
    <div class="eyebrow" style="position:absolute;left:0;right:0;top:64px;color:#7B5CA8;font-size:34px">Postcode</div>
    <div class="hero grad-light" style="position:absolute;left:0;right:0;top:110px;font-size:330px">2287</div>
  </div>
  <div class="tile" style="left:60px;width:470px;top:790px;height:560px"><img src="photos/house-colour.jpg" style="width:100%;height:100%;object-fit:cover;object-position:52% 50%"></div>
  <div class="tile" style="left:550px;right:60px;top:790px;height:560px;background:#392B3D;color:#F5F5F7;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;padding:52px">
    <div class="sub" style="font-size:66px">Find out where <span style="color:#C2ADE0">your home</span> sits.</div>
  </div>
  <div class="tile" style="left:60px;right:60px;top:1380px;height:190px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 56px;box-shadow:0 2px 20px rgba(0,0,0,.04)">
    <div class="small" style="color:#6E6E73;font-size:34px">No Cost. No Commitment.</div>
    <span class="btn" style="background:#7B5CA8;color:#fff;height:120px;padding:0 56px">Book a Chat<span class="chev"></span></span>
  </div>
</section>

</body>
</html>
