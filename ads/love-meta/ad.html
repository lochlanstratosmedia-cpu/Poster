<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love night ads</title>
<style>
  /* Proxima Nova is licensed, so drop the files into assets/fonts/ under
     these names and they win. Until then Montserrat stands in. */
  @font-face { font-family: "Brand Sans"; font-weight: 400; src: url("../../assets/fonts/ProximaNova-Regular.otf"); }
  @font-face { font-family: "Brand Sans"; font-weight: 600; src: url("../../assets/fonts/ProximaNova-Semibold.otf"); }
  @font-face { font-family: "Brand Sans"; font-weight: 800; src: url("../../assets/fonts/ProximaNova-Extrabold.otf"); }
  @font-face { font-family: "Brand Sans Fallback"; font-weight: 400; src: url("../../assets/fonts/Montserrat-Regular.ttf"); }
  @font-face { font-family: "Brand Sans Fallback"; font-weight: 600; src: url("../../assets/fonts/Montserrat-SemiBold.ttf"); }
  @font-face { font-family: "Brand Sans Fallback"; font-weight: 800; src: url("../../assets/fonts/Montserrat-ExtraBold.ttf"); }
  @font-face { font-family: "Gloock"; src: url("../../assets/fonts/Gloock.ttf"); }

  :root {
    --ink: #05040b;
    --plum: #52215f;     /* the dot in the love. logo */
    --lilac: #c9a6e8;
    --gold: #e9c48a;
    --warm: #ffcf8f;
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #wrap { position: absolute; inset: 0; display: grid; place-items: center; }
  #stage {
    position: relative; width: 1080px; overflow: hidden; background: var(--ink); color: #fff;
    transform-origin: center center; font-family: "Brand Sans", "Brand Sans Fallback", sans-serif;
  }
  #stage * { box-sizing: border-box; }
  .layer { position: absolute; inset: 0; }
  .serif { font-family: "Gloock", serif; font-weight: 400; }
  .caps { font-weight: 800; text-transform: uppercase; letter-spacing: .26em; }

  #fg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
  .foot { display: flex; flex-direction: column; align-items: center; }

  /* A line of type that rises out of its own mask. */
  .line { overflow: hidden; padding: 0 .08em .14em; margin-bottom: -.14em; }
  .line > div {
    background: linear-gradient(105deg, #fff 0%, #fff 42%, #ffe6bd 50%, #fff 58%, #fff 100%);
    background-size: 260% 100%; background-position: 100% 0;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    will-change: transform;
  }
  .gold { -webkit-text-fill-color: var(--gold); }
  .dot { color: #a46cc8; }

  .cta {
    display: inline-flex; align-items: center; gap: .7em; border: 2px solid rgba(255,255,255,.88);
    border-radius: 999px; font-weight: 800; text-transform: uppercase; letter-spacing: .22em;
    background: rgba(82,33,95,.35); backdrop-filter: blur(6px);
  }
  .cta svg { width: 1.1em; height: 1.1em; }

  #picker {
    position: fixed; top: 10px; left: 10px; z-index: 10; display: flex; gap: 6px; flex-wrap: wrap; max-width: 96vw;
    font: 13px/1 system-ui, sans-serif;
  }
  #picker a { color: #fff; background: #2a2433; padding: 7px 9px; border-radius: 6px; text-decoration: none; }
  #picker a.on { background: #52215f; }
  body.render #picker { display: none; }
</style>
</head>
<body>
<div id="picker"></div>
<div id="wrap"><div id="stage"></div></div>

<script>
// Night-time Meta ads for love. Each ad is a pure function of time: draw(t)
// sets the whole frame for t seconds, so render.mjs can step it frame by
// frame and the last frame doubles as the still image ad.
//
//   ad.html?ad=fees&fmt=story     9:16, 1080x1920 (Stories, Reels)
//   ad.html?ad=fees&fmt=feed      4:5,  1080x1350 (Feed)
//   ad.html?ad=fees&t=10          freeze on one moment

const params = new URLSearchParams(location.search);
const AD = params.get("ad") || "fees";
const FMT = params.get("fmt") === "feed" ? "feed" : "story";
const RENDER = params.has("render");
const DURATION = 10;
const LOGO = params.get("logo") || "logos/love.png";

// Story keeps clear of the Reels UI: roughly the top 14% and bottom 20%.
const F = {
  story: { H: 1920, S: 1,   top: 250, bottom: 380, sky: 360 },
  feed:  { H: 1350, S: .8,  top: 86,  bottom: 150, sky: 230 },
}[FMT];
const W = 1080, H = F.H, S = F.S;
const px = v => Math.round(v * S) + "px";

const stage = document.getElementById("stage");
stage.style.height = H + "px";
const NS = "http://www.w3.org/2000/svg";
const pending = [];

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, start, dur) => clamp((t - start) / dur);
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeOut5 = p => 1 - Math.pow(1 - p, 5);
const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeOutBack = (p, c = 1.4) => 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2);
const pulse = (t, at, len) => { const x = (t - at) / len; return x > 0 && x < 1 ? Math.sin(Math.PI * x) : 0; };
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let r = Math.imul(seed ^ seed >>> 15, 1 | seed); r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; };
}
function el(tag, css = {}, parent = stage, html = "") {
  const e = document.createElement(tag);
  Object.assign(e.style, css);
  if (html) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
function svgEl(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function fadeUp(node, t, start, dur = .8, dist = 26) {
  const p = easeOut(prog(t, start, dur));
  node.style.opacity = p;
  node.style.transform = `translateY(${(1 - p) * dist * S}px)`;
}
function strokeDraw(path, p) {
  const L = path._len || (path._len = path.getTotalLength());
  path.style.strokeDasharray = L;
  path.style.strokeDashoffset = L * (1 - p);
}
function glowFilter(svg, id, sd, box) {
  const region = box ? { filterUnits: "userSpaceOnUse", x: -sd * 4, y: -box[1], width: box[0] + sd * 8, height: box[1] * 3 } : { x: "-50%", y: "-50%", width: "200%", height: "200%" };
  const f = svgEl("filter", { id, ...region }, svg);
  svgEl("feGaussianBlur", { stdDeviation: sd, result: "b" }, f);
  const m = svgEl("feMerge", {}, f);
  svgEl("feMergeNode", { in: "b" }, m); svgEl("feMergeNode", { in: "SourceGraphic" }, m);
}

// Headline: one masked line per entry. "*word*" is set in gold.
function headline(parent, lines, size, css = {}) {
  const box = el("div", { fontSize: px(size), lineHeight: 1.04, letterSpacing: "-.01em", ...css }, parent);
  box.className = "serif";
  const inners = lines.map(l => {
    const line = el("div", {}, box); line.className = "line";
    return el("div", {}, line, l.replace(/\*(.+?)\*/g, '<span class="gold">$1</span>'));
  });
  return {
    box,
    update(t, start, { gap = .13, sweeps = [] } = {}) {
      inners.forEach((n, i) => {
        const p = easeOut5(prog(t, start + i * gap, 1));
        n.style.transform = `translateY(${(1 - p) * 112}%)`;
        let pos = 100;
        for (const s of sweeps) { const q = prog(t, s + i * .08, 1.3); if (q > 0 && q < 1) pos = lerp(100, 0, easeInOut(q)); }
        n.style.backgroundPosition = `${pos}% 0`;
      });
    },
  };
}
function capsLabel(parent, text, size = 30, color = "var(--lilac)") {
  const n = el("div", { fontSize: px(size), color }, parent, text);
  n.className = "caps";
  return n;
}
function cta(parent, text) {
  const n = el("div", { fontSize: px(30), padding: `${px(26)} ${px(46)}` }, parent,
    `${text}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>`);
  n.className = "cta";
  return {
    n,
    update(t, start) {
      const p = prog(t, start, .7);
      n.style.opacity = easeOut(p);
      n.style.transform = `scale(${lerp(.86, 1, easeOutBack(p))})`;
      const g = pulse(t, start + 1.4, 1.2) + pulse(t, start + 3.4, 1.2);
      n.style.boxShadow = `0 0 ${px(10 + 40 * g)} rgba(201,166,232,${.15 + .45 * g}), inset 0 0 ${px(20)} rgba(201,166,232,.12)`;
    },
  };
}

// ---------- the night scene, shared by every ad ----------
function nightScene() {
  const scene = el("div", { transformOrigin: "50% 70%" }); scene.className = "layer";
  const sky = el("div", { background: "linear-gradient(180deg, #04030a 0%, #090719 38%, #150d2c 70%, #2a1540 100%)" }, scene); sky.className = "layer";

  // slow plum haze so the sky never sits dead
  const hazes = [
    { x: .2, y: .55, r: 700, c: "rgba(107,47,138,.38)", sp: .09, ph: 0 },
    { x: .85, y: .7, r: 620, c: "rgba(82,33,95,.45)", sp: .07, ph: 2 },
    { x: .5, y: .92, r: 900, c: "rgba(255,170,120,.10)", sp: .05, ph: 4 },
  ].map(h => ({ ...h, n: el("div", { position: "absolute", width: h.r * 2 + "px", height: h.r * 2 + "px", borderRadius: "50%", background: `radial-gradient(circle, ${h.c} 0%, rgba(0,0,0,0) 68%)` }, scene) }));

  // moon
  const mx = W * .78, my = H * (FMT === "story" ? .2 : .17);
  const moonGlow = el("div", { position: "absolute", width: "760px", height: "760px", left: mx - 380 + "px", top: my - 380 + "px", borderRadius: "50%", background: "radial-gradient(circle, rgba(226,210,255,.28) 0%, rgba(160,110,220,.10) 30%, rgba(0,0,0,0) 62%)" }, scene);
  const moon = el("div", { position: "absolute", width: "92px", height: "92px", left: mx - 46 + "px", top: my - 46 + "px", borderRadius: "50%", background: "radial-gradient(circle at 38% 36%, #fffaf0 0%, #efe4ff 55%, #cdb8ee 100%)", boxShadow: "0 0 60px rgba(236,224,255,.55), 0 0 160px rgba(180,140,240,.35)" }, scene);

  // stars, drawn on canvas each frame
  const cv = el("canvas", {}, scene); cv.className = "layer"; cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  const r = rng(7);
  const stars = [...Array(170)].map(() => ({ x: r() * W, y: Math.pow(r(), 1.6) * H * .72, s: .5 + Math.pow(r(), 3) * 2.2, a: .25 + r() * .75, sp: .6 + r() * 2.4, ph: r() * 6.28 }));

  // houses: a soft far row and a near row with windows that light up
  const svg = svgEl("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, style: "position:absolute;left:0;top:0" }, scene);
  glowFilter(svg, "bloom", 9);
  const defs = svgEl("defs", {}, svg);
  const grad = svgEl("linearGradient", { id: "ground", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  svgEl("stop", { offset: 0, "stop-color": "#0a0714" }, grad);
  svgEl("stop", { offset: 1, "stop-color": "#030207" }, grad);

  const base = H - F.sky * .16;
  function row(seed, scale, fill, lit) {
    const g = svgEl("g", {}, svg);
    const rr = rng(seed);
    const wins = [];
    let x = -90;
    while (x < W + 90) {
      const kind = rr() < .38 ? "modern" : "gable";
      const w = (130 + rr() * 120) * scale;
      const wh = (kind === "modern" ? 120 + rr() * 90 : 85 + rr() * 70) * scale * (F.sky / 360);
      const top = base - wh;
      let d;
      if (kind === "gable") {
        const rh = w * (.3 + rr() * .14);
        d = `M${x} ${base}V${top}L${x + w / 2} ${top - rh}L${x + w} ${top}V${base}Z`;
        if (rr() < .5) { const cx = x + w * (.68 + rr() * .1); d += `M${cx} ${top - rh * .45}h${10 * scale}v${-rh * .6}h${-10 * scale}Z`; }
      } else {
        const step = rr() < .6 ? w * (.35 + rr() * .2) : 0;
        const lift = 40 * scale * (F.sky / 360);
        d = `M${x} ${base}V${top}H${x + w - step}V${top - (step ? lift : 0)}H${x + w}V${base}Z`;
      }
      svgEl("path", { d, fill }, g);
      if (lit) {
        const add = (wx, wy, ww, wh2) => wins.push({ x: wx, y: wy, w: ww, h: wh2, on: rr() < .72 ? .7 + rr() * 5.6 : 99, warm: rr() < .7 });
        if (kind === "modern") {
          add(x + w * .1, top + wh * .18, w * .5, wh * .34);
          if (rr() < .6) add(x + w * .66, top + wh * .52, w * .2, wh * .3);
        } else {
          add(x + w * .18, top + wh * .3, w * .2, wh * .26);
          add(x + w * .58, top + wh * .3, w * .2, wh * .26);
        }
      }
      x += w + (6 + rr() * 26) * scale;
      // a tree now and then
      if (lit && rr() < .35) {
        const tr = (26 + rr() * 22) * scale;
        svgEl("ellipse", { cx: x - 4, cy: base - tr * 1.1, rx: tr * .8, ry: tr * 1.2, fill }, g);
        svgEl("rect", { x: x - 6, y: base - tr * .4, width: 5, height: tr * .4, fill }, g);
      }
    }
    return { g, wins };
  }
  const far = row(31, .78, "#1a1130", false);
  far.g.setAttribute("opacity", ".8");
  const near = row(12, 1, "#07050e", true);
  // street lamps
  const lamps = [W * .3, W * .74].map((lx, i) => {
    const lh = F.sky * .62;
    svgEl("rect", { x: lx - 2.5, y: base - lh, width: 5, height: lh, fill: "#07050e" }, near.g);
    svgEl("path", { d: `M${lx} ${base - lh}q0 -14 22 -14`, stroke: "#07050e", "stroke-width": 5, fill: "none" }, near.g);
    const bulb = svgEl("circle", { cx: lx + 22, cy: base - lh + 4, r: 7, fill: "#ffe2b0", filter: "url(#bloom)" }, svg);
    const cone = svgEl("path", { d: `M${lx + 22} ${base - lh + 6}L${lx - 70} ${base}H${lx + 114}Z`, fill: "rgba(255,214,150,.07)" }, svg);
    return { bulb, cone, on: .4 + i * .25 };
  });
  const ground = svgEl("rect", { x: 0, y: base, width: W, height: H - base, fill: "url(#ground)" }, svg);
  const winG = svgEl("g", {}, svg);
  const winBloom = svgEl("g", { filter: "url(#bloom)" }, svg);
  near.wins.forEach(w => {
    const c = w.warm ? "#ffcb86" : "#ffe9c9";
    w.a = svgEl("rect", { x: w.x, y: w.y, width: w.w, height: w.h, fill: c, rx: 1.5 }, winG);
    w.b = svgEl("rect", { x: w.x, y: w.y, width: w.w, height: w.h, fill: c }, winBloom);
  });
  // flicker as a light comes on, then steady
  const lightOn = (t, at) => {
    const d = t - at;
    if (d < 0) return 0;
    if (d > .32) return 1;
    return [1, .15, .9, .3, 1, .6, 1][Math.floor(d / .045)] ?? 1;
  };

  return t => {
    scene.style.transform = `scale(${lerp(1.07, 1, easeOut(prog(t, 0, DURATION)))})`;
    hazes.forEach(h => {
      h.n.style.left = W * h.x - h.r + Math.sin(t * h.sp + h.ph) * 60 + "px";
      h.n.style.top = H * h.y - h.r + Math.cos(t * h.sp * .8 + h.ph) * 40 + "px";
    });
    const mp = easeOut(prog(t, .2, 2.2));
    moon.style.opacity = moonGlow.style.opacity = mp;
    moon.style.transform = moonGlow.style.transform = `translateY(${(1 - mp) * 30 + t * -1.5}px)`;

    ctx.clearRect(0, 0, W, H);
    const sf = easeOut(prog(t, 0, 1.6));
    for (const s of stars) {
      ctx.globalAlpha = sf * s.a * (.55 + .45 * Math.sin(t * s.sp + s.ph));
      ctx.fillStyle = "#f4ecff";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 6.283); ctx.fill();
    }
    // one shooting star early on
    const sp = prog(t, 1.6, .75);
    if (sp > 0 && sp < 1) {
      const x0 = W * .15, y0 = H * .1, dx = W * .42, dy = H * .07;
      const hx = x0 + dx * easeOut(sp), hy = y0 + dy * easeOut(sp);
      const g = ctx.createLinearGradient(hx - dx * .35, hy - dy * .35, hx, hy);
      g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(1, "rgba(255,248,235,.95)");
      ctx.globalAlpha = Math.sin(Math.PI * sp);
      ctx.strokeStyle = g; ctx.lineWidth = 2.4; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(hx - dx * .35, hy - dy * .35); ctx.lineTo(hx, hy); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    far.g.setAttribute("transform", `translate(${-t * 1.5} 0)`);
    near.g.setAttribute("transform", `translate(${-t * 3} 0)`);
    winG.setAttribute("transform", `translate(${-t * 3} 0)`);
    winBloom.setAttribute("transform", `translate(${-t * 3} 0)`);
    near.wins.forEach(w => {
      const o = lightOn(t, w.on);
      w.a.setAttribute("opacity", .05 + .95 * o);
      w.b.setAttribute("opacity", .55 * o);
    });
    lamps.forEach(l => {
      const o = lightOn(t, l.on);
      l.bulb.setAttribute("opacity", o); l.cone.setAttribute("opacity", o);
      l.bulb.setAttribute("transform", `translate(${-t * 3} 0)`); l.cone.setAttribute("transform", `translate(${-t * 3} 0)`);
    });
  };
}

// Film grain and vignette over everything; a fade up from black at the top.
function finish() {
  const tiles = [...Array(4)].map((_, k) => {
    const c = document.createElement("canvas"); c.width = c.height = 220;
    const x = c.getContext("2d"), img = x.createImageData(220, 220), r = rng(100 + k);
    for (let i = 0; i < img.data.length; i += 4) { const v = r() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
    x.putImageData(img, 0, 0);
    return c.toDataURL();
  });
  const grain = el("div", { opacity: .045, mixBlendMode: "screen", pointerEvents: "none" }); grain.className = "layer";
  const vig = el("div", { background: "radial-gradient(ellipse 80% 70% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%)", pointerEvents: "none" }); vig.className = "layer";
  const black = el("div", { background: "#000", pointerEvents: "none" }); black.className = "layer";
  return t => {
    grain.style.backgroundImage = `url(${tiles[Math.floor(t * 24) % 4]})`;
    black.style.opacity = 1 - easeOut(prog(t, 0, .9));
  };
}

// The foreground column: logo at the top, the ad's own body, then the foot.
function frame() {
  const fg = el("div", { paddingTop: F.top + "px", paddingBottom: F.bottom + "px" }); fg.id = "fg";
  const logoBox = el("div", { position: "relative", height: px(80) }, fg);
  const img = new Image(); img.style.height = "100%"; img.style.display = "block";
  pending.push(new Promise(done => { img.onload = img.onerror = done; }));
  img.src = LOGO; logoBox.appendChild(img);
  // a glow that sits behind the plum dot of the logo
  const dotGlow = el("div", { position: "absolute", width: px(120), height: px(120), right: px(-48), bottom: px(-46), borderRadius: "50%", background: "radial-gradient(circle, rgba(196,130,240,.75) 0%, rgba(120,60,170,.25) 35%, rgba(0,0,0,0) 70%)", mixBlendMode: "screen" }, logoBox);
  const body = el("div", {}, fg); body.className = "body";
  const foot = el("div", {}, fg); foot.className = "foot";
  return {
    body, foot,
    update(t) {
      const p = easeOut(prog(t, .35, 1));
      logoBox.style.opacity = p;
      logoBox.style.transform = `translateY(${(1 - p) * -16}px)`;
      dotGlow.style.opacity = easeOut(prog(t, 1.1, .6)) * (.7 + .3 * Math.sin(t * 2.2));
    },
  };
}

function desc(parent, html, mt = 0) {
  const n = el("div", { fontSize: px(34), fontWeight: 600, color: "rgba(255,255,255,.82)", letterSpacing: ".01em", marginTop: px(mt), marginBottom: px(36), maxWidth: "880px" }, parent, html);
  return n;
}

// ---------- the ads ----------
const ADS = {};
const LOVE = 'love<span class="dot">.</span>';

// 1. Zero management fees: a dollar reel spins down and lands on $0.
ADS.fees = function (fr) {
  const label = capsLabel(fr.body, "Management fees", 30);
  const big = el("div", { position: "relative", display: "flex", alignItems: "flex-start", fontSize: px(400), lineHeight: 1, margin: `${px(8)} 0 ${px(28)}`, height: "1em" }, fr.body);
  big.className = "serif";
  const ring = el("div", { position: "absolute", left: "50%", top: "50%", width: px(520), height: px(520), marginLeft: px(-260), marginTop: px(-260), borderRadius: "50%", border: "2px solid rgba(233,196,138,.7)" }, big);
  const dollar = el("div", { fontSize: ".46em", marginTop: ".16em", marginRight: ".04em", color: "var(--gold)" }, big, "$");
  const win = el("div", { height: "1em", overflow: "hidden" }, big);
  const seq = [8, 3, 6, 1, 9, 4, 7, 2, 5, 8, 3, 6, 9, 1, 4, 0];
  const reel = el("div", {}, win, seq.map(d => `<div style="height:1em">${d}</div>`).join(""));
  const h1 = headline(fr.body, ["Pay *zero*", "management fees"], 104);
  const cond = el("div", { fontSize: px(30), color: "rgba(255,255,255,.66)", marginTop: px(22), letterSpacing: ".04em" }, fr.body, "Conditions apply.");
  const d = desc(fr.foot, `See how ${LOVE} property management works`);
  const c = cta(fr.foot, "Learn more");
  const LAND = 2.7;
  return t => {
    fadeUp(label, t, .5);
    big.style.opacity = easeOut(prog(t, .55, .5));
    const p = prog(t, .6, LAND - .6);
    const pos = easeOut5(p) * (seq.length - 1);
    reel.style.transform = `translateY(${-pos}em)`;
    const speed = p < 1 ? 5 * Math.pow(1 - p, 4) : 0;
    win.style.filter = speed > .01 ? `blur(${Math.min(14, speed * 3) * S}px)` : "none";
    const bloom = pulse(t, LAND - .05, 1.1);
    big.style.filter = `drop-shadow(0 0 ${(18 + 40 * bloom) * S}px rgba(233,196,138,${.22 + .5 * bloom}))`;
    const rp = prog(t, LAND - .05, 1.4);
    ring.style.opacity = rp > 0 && rp < 1 ? (1 - rp) * .9 : 0;
    ring.style.transform = `scale(${lerp(.5, 1.5, easeOut(rp))})`;
    h1.update(t, 3.0, { sweeps: [5.0, 8.2] });
    fadeUp(cond, t, 3.7);
    fadeUp(d, t, 4.3);
    c.update(t, 4.9);
  };
};

// 2 and 4a. "Let's chat": the postcode flickers on like a lit house number.
function chat(P) {
  return function (fr) {
    const bubble = svgEl("svg", { width: px(150), height: px(118), viewBox: "0 0 150 118", style: "overflow:visible" });
    fr.body.appendChild(bubble);
    glowFilter(bubble, "bglow", 4);
    const bpath = svgEl("path", { d: "M30 8H120A22 22 0 0 1 142 30V64A22 22 0 0 1 120 86H66L38 110V86H30A22 22 0 0 1 8 64V30A22 22 0 0 1 30 8Z", fill: "rgba(82,33,95,.35)", stroke: "#e9c48a", "stroke-width": 4, "stroke-linejoin": "round", filter: "url(#bglow)" }, bubble);
    const dots = [52, 75, 98].map(cx => svgEl("circle", { cx, cy: 47, r: 7, fill: "#fff" }, bubble));
    const num = el("div", { fontSize: px(330), lineHeight: 1, margin: `${px(10)} 0 ${px(18)}`, letterSpacing: ".02em" }, fr.body);
    num.className = "serif";
    const digits = [...P].map(ch => el("span", { display: "inline-block" }, num, ch));
    const h1 = headline(fr.body, ["homeowners,", "*let's chat*"], 112);
    const d = desc(fr.foot, "No-obligation appraisal. No pressure to list.");
    const c = cta(fr.foot, "Get quote");
    return t => {
      const bp = prog(t, .5, .9);
      bubble.style.opacity = clamp(bp * 4);
      bubble.style.transform = `translateY(${(1 - easeOutBack(bp)) * 30 * S}px)`;
      strokeDraw(bpath, easeInOut(bp));
      bpath.setAttribute("fill-opacity", easeOut(prog(t, 1.1, .5)));
      dots.forEach((dt, i) => {
        const on = easeOut(prog(t, 1.2, .4));
        const hop = Math.max(0, Math.sin((t - 1.2) * 6 - i * .9));
        dt.setAttribute("opacity", on * (.45 + .55 * hop));
        dt.setAttribute("transform", `translate(0 ${-hop * 5})`);
      });
      digits.forEach((s, i) => {
        const at = .9 + i * .2, dd = t - at;
        const o = dd < 0 ? 0 : dd > .4 ? 1 : [.8, .1, .6, 0, 1, .4, 1, .7, 1][Math.floor(dd / .045)] ?? 1;
        s.style.opacity = o;
        const g = o * (1 + .25 * pulse(t, at + .4, .8));
        s.style.textShadow = `0 0 ${px(18)} rgba(255,236,210,${.55 * g}), 0 0 ${px(60)} rgba(201,166,232,${.6 * g}), 0 0 ${px(120)} rgba(140,80,200,${.4 * g})`;
      });
      h1.update(t, 2.2, { sweeps: [4.6, 8.2] });
      fadeUp(d, t, 3.6);
      c.update(t, 4.2);
    };
  };
}

// 3 and 4b. "Would the right price change your mind?": a marker finds its spot on a scale.
function price(P, word = "price", foot = `Find out where your ${P} home sits`, label = `${P} homeowners`) {
  return function (fr) {
    const lab = capsLabel(fr.body, label, 30);
    lab.style.marginBottom = px(30);
    const h1 = headline(fr.body, ["Would the", `*right ${word}*`, "change your mind?"], 118);
    const gw = 860, gh = 200;
    const g = svgEl("svg", { width: px(gw), height: px(gh), viewBox: `0 0 ${gw} ${gh}`, style: `overflow:visible;margin-top:${px(40)}` });
    fr.body.appendChild(g);
    glowFilter(g, "lglow", 6, [gw, gh]);
    const defs = svgEl("defs", {}, g);
    const lg = svgEl("linearGradient", { id: "lg", gradientUnits: "userSpaceOnUse", x1: 0, y1: 0, x2: gw, y2: 0 }, defs);
    [[0, "rgba(201,166,232,0)"], [.18, "#c9a6e8"], [.82, "#e9c48a"], [1, "rgba(233,196,138,0)"]].forEach(([o, c]) => svgEl("stop", { offset: o, "stop-color": c }, lg));
    const y = 150;
    const axis = svgEl("path", { d: `M10 ${y}H${gw - 10}`, stroke: "url(#lg)", "stroke-width": 4, fill: "none", filter: "url(#lglow)" }, g);
    const ticks = [...Array(15)].map((_, i) => {
      const x = 70 + i * ((gw - 140) / 14), big = i % 7 === 0;
      return svgEl("path", { d: `M${x} ${y - (big ? 20 : 11)}V${y + (big ? 20 : 11)}`, stroke: "rgba(255,255,255,.5)", "stroke-width": big ? 3 : 2 }, g);
    });
    const marker = svgEl("g", {}, g);
    svgEl("path", { d: `M0 ${y - 4}V${y - 150}`, stroke: "rgba(233,196,138,.35)", "stroke-width": 2, "stroke-dasharray": "4 8" }, marker);
    svgEl("circle", { cx: 0, cy: y, r: 13, fill: "#fff", filter: "url(#lglow)" }, marker);
    // house-shaped pin
    svgEl("path", { d: `M-34 ${y - 46}V${y - 92}L0 ${y - 124}L34 ${y - 92}V${y - 46}Z`, fill: "#e9c48a", filter: "url(#lglow)" }, marker);
    svgEl("rect", { x: -9, y: y - 74, width: 18, height: 28, rx: 2, fill: "#2a1540" }, marker);
    const d = desc(fr.foot, foot, 50);
    const c = cta(fr.foot, "Get quote");
    const target = gw * .66;
    return t => {
      fadeUp(lab, t, .5);
      h1.update(t, .8, { gap: .16, sweeps: [4.8, 8.2] });
      strokeDraw(axis, easeInOut(prog(t, 2.0, 1.1)));
      ticks.forEach((tk, i) => tk.setAttribute("opacity", easeOut(prog(t, 2.1 + i * .05, .3))));
      const mp = prog(t, 2.6, 1.8);
      const mx = lerp(gw * .12, target, easeOutBack(mp, 1.1));
      marker.setAttribute("opacity", easeOut(prog(t, 2.6, .3)));
      marker.setAttribute("transform", `translate(${mx} ${-6 * pulse(t, 4.3, .5)})`);
      fadeUp(d, t, 4.1);
      c.update(t, 4.6);
    };
  };
}

// 5. Test the market: an envelope opens and an offer card rises out.
ADS.offer = function (fr) {
  const lead = el("div", { fontSize: px(52), color: "rgba(255,255,255,.88)", marginBottom: px(34) }, fr.body, "You might not be planning to sell.");
  lead.className = "serif";
  const ew = 440, eh = 360;
  const s = svgEl("svg", { width: px(ew), height: px(eh), viewBox: `0 0 ${ew} ${eh}`, style: "overflow:visible" });
  fr.body.appendChild(s);
  glowFilter(s, "eglow", 10);
  const env = svgEl("g", {}, s);
  const top = 150, L = 20, R = ew - 20, B = eh - 10, mid = ew / 2;
  const back = svgEl("path", { d: `M${L} ${top}H${R}V${B}H${L}Z`, fill: "#1d1233", stroke: "rgba(233,196,138,.45)", "stroke-width": 2 }, env);
  const flapBack = svgEl("path", { d: `M${L} ${top}L${mid} ${top + 130}L${R} ${top}Z`, fill: "#26183f", stroke: "rgba(233,196,138,.5)", "stroke-width": 2 }, env);
  const card = svgEl("g", {}, env);
  svgEl("rect", { x: L + 34, y: top + 18, width: R - L - 68, height: 172, rx: 10, fill: "#fbf6ee", filter: "url(#eglow)" }, card);
  const ofr = svgEl("text", { x: mid, y: top + 72, "text-anchor": "middle", "font-family": "Brand Sans, Brand Sans Fallback, sans-serif", "font-weight": 800, "font-size": 24, "letter-spacing": 7, fill: "#52215f" }, card);
  ofr.textContent = "OFFER";
  svgEl("rect", { x: mid - 110, y: top + 100, width: 220, height: 30, rx: 15, fill: "#e9c48a" }, card);
  svgEl("rect", { x: mid - 80, y: top + 146, width: 160, height: 12, rx: 6, fill: "rgba(82,33,95,.22)" }, card);
  svgEl("rect", { x: mid - 60, y: top + 168, width: 120, height: 12, rx: 6, fill: "rgba(82,33,95,.16)" }, card);
  const front = svgEl("path", { d: `M${L} ${top}L${mid} ${top + 120}L${R} ${top}V${B}H${L}Z`, fill: "#2b1b47", stroke: "rgba(233,196,138,.55)", "stroke-width": 2 }, env);
  const flapFront = svgEl("g", {}, env);
  svgEl("path", { d: `M${L} ${top}L${mid} ${top + 130}L${R} ${top}Z`, fill: "#352255", stroke: "rgba(233,196,138,.6)", "stroke-width": 2 }, flapFront);
  // wax seal with a heart, in the logo's plum
  const seal = svgEl("g", {}, flapFront);
  svgEl("circle", { cx: mid, cy: top + 118, r: 30, fill: "#52215f", stroke: "#7a3a93", "stroke-width": 4 }, seal);
  svgEl("path", { d: `M${mid} ${top + 133}c-14-10-20-16-20-24a10 10 0 0 1 20-4a10 10 0 0 1 20 4c0 8-6 14-20 24z`, fill: "#e9c48a" }, seal);
  const h1 = headline(fr.body, ["Would the", "*right offer*", "change your mind?"], 108, { marginTop: px(40) });
  const d = desc(fr.foot, "No-obligation appraisal. See where you sit.");
  const c = cta(fr.foot, "Get quote");
  return t => {
    fadeUp(lead, t, .5, 1);
    const ep = prog(t, 1.0, .9);
    env.style.opacity = easeOut(ep);
    env.setAttribute("transform", `translate(0 ${(1 - easeOutBack(ep)) * 80})`);
    // flap opens around its top edge; once past flat it goes behind the card
    const fp = easeInOut(prog(t, 1.9, .7));
    const sy = Math.cos(fp * Math.PI);
    flapFront.style.display = sy > 0 ? "" : "none";
    flapFront.setAttribute("transform", `translate(0 ${top}) scale(1 ${Math.max(sy, .001)}) translate(0 ${-top})`);
    flapBack.style.display = sy <= 0 ? "" : "none";
    flapBack.setAttribute("transform", `translate(0 ${top}) scale(1 ${Math.min(sy, -.001)}) translate(0 ${-top})`);
    const cp = prog(t, 2.5, 1);
    card.setAttribute("transform", `translate(0 ${-150 * easeOutBack(cp, 1.2)})`);
    card.style.filter = `drop-shadow(0 0 ${20 * pulse(t, 3.3, 1.2)}px rgba(233,196,138,.8))`;
    h1.update(t, 3.3, { gap: .15, sweeps: [5.4, 8.4] });
    fadeUp(d, t, 4.6);
    c.update(t, 5.2);
  };
};

ADS["chat-2287"] = chat("2287");
ADS["price-2287"] = price("2287");
ADS["chat-2284"] = chat("2284");
ADS["price-2284"] = price("2284");

// ---------- boot ----------
const sceneDraw = nightScene();
const fr = frame();
const adDraw = (ADS[AD] || ADS.fees)(fr);
const finishDraw = finish();
const draw = t => { sceneDraw(t); fr.update(t); adDraw(t); finishDraw(t); };
window.draw = draw;
window.DURATION = DURATION;
window.FORMAT = { w: W, h: H };
window.ready = Promise.all([document.fonts.ready, ...pending]).then(() => true);

if (RENDER) {
  document.body.classList.add("render");
  document.getElementById("wrap").style.placeItems = "start";
} else {
  const fit = () => stage.style.transform = `scale(${Math.min(innerWidth / W, (innerHeight - 50) / H)})`;
  fit(); addEventListener("resize", fit);
  const picker = document.getElementById("picker");
  const link = (label, k, v) => {
    const q = new URLSearchParams(location.search); q.set(k, v); q.delete("t");
    const a = el("a", {}, picker, label); a.href = "?" + q;
    if ((k === "ad" ? AD : FMT) === v) a.className = "on";
  };
  Object.keys(ADS).forEach(k => link(k, "ad", k));
  link("9:16", "fmt", "story"); link("4:5", "fmt", "feed");
  window.ready.then(() => {
    if (params.has("t")) return draw(Number(params.get("t")));
    const t0 = performance.now();
    const loop = now => { draw(((now - t0) / 1000) % (DURATION + 1.5)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
