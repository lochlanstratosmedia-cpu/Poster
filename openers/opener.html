<title>Reel Opener Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: control rail on the left, live 9:16 preview on the right; stacks on phones with the preview first. Same tokens as tools/cover-editor.html. */
:root {
  --bg: #e9eae4;
  --panel: #f6f6f2;
  --ink: #1a1c1a;
  --muted: #5e635c;
  --line: #cfd2c8;
  --accent: #1f4d3a;
  --accent-ink: #f4f6f1;
  --field: #ffffff;
  --ui: "Instrument Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141614; --panel: #1c1f1c; --ink: #e8eae4; --muted: #9aa097;
    --line: #333832; --accent: #7fb49a; --accent-ink: #0f1a14; --field: #232723;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141614; --panel: #1c1f1c; --ink: #e8eae4; --muted: #9aa097;
  --line: #333832; --accent: #7fb49a; --accent-ink: #0f1a14; --field: #232723;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--ui); padding-inline: 16px; padding-block: 20px 40px; margin: 0; }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 20px; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); align-items: start; }
@media (max-width: 820px) { .wrap { grid-template-columns: minmax(0, 1fr); } .proof { order: -1; } }
header.top { max-width: 1100px; margin: 0 auto 18px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 0; font-size: 13px; }
.rail { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 18px; min-width: 0; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 10px; min-width: 0; }
legend { font: 500 11px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; padding: 0; }
label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); min-width: 0; }
label output { font: 12px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.lab { display: flex; justify-content: space-between; gap: 8px; }
input[type=text], select { width: 100%; font: 14px/1.35 var(--ui); color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
input:focus-visible, select:focus-visible, button:focus-visible, .drop:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { font: 500 12.5px/1 var(--ui); color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 999px; padding: 7px 11px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.check { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 13px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.drop { border: 1px dashed var(--line); border-radius: 8px; padding: 14px; text-align: center; color: var(--muted); cursor: pointer; background: var(--field); }
.drop.over { border-color: var(--accent); color: var(--ink); }
.drop strong { color: var(--ink); font-weight: 500; }
.proof { min-width: 0; display: grid; gap: 12px; justify-items: center; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.stage { width: 100%; max-width: 380px; }
canvas#c { width: 100%; height: auto; display: block; border-radius: 6px; box-shadow: 0 1px 2px rgb(0 0 0 / 0.12), 0 12px 32px -12px rgb(0 0 0 / 0.35); background: #000; }
.transport { width: 100%; max-width: 380px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.transport output { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 9ch; text-align: right; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.btn { font: 600 13px/1 var(--ui); padding: 10px 16px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:disabled { opacity: .55; cursor: default; }
.meta { font: 12px/1.4 var(--mono); color: var(--muted); text-align: center; margin: 0; }
.result { width: 100%; max-width: 380px; display: grid; gap: 8px; }
.result video { width: 100%; border-radius: 6px; background: #000; }
.note { font-size: 12px; color: var(--muted); margin: 0; }

/* Render mode: used by render.mjs. Canvas at native size, nothing else. */
body.render { padding: 0; background: transparent; }
body.render header.top, body.render .rail, body.render .transport, body.render .actions, body.render .meta, body.render .result { display: none !important; }
body.render .wrap { display: block; max-width: none; }
body.render .stage { max-width: none; }
body.render canvas#c { width: auto; border-radius: 0; box-shadow: none; background: transparent; }
</style>

<header class="top">
  <div>
    <h1>Reel Opener Studio</h1>
    <p class="sub">Add a property photo or clip, type the search, save the opener.</p>
  </div>
  <p class="sub" id="dims">1080 × 1920 px · 9:16 Reel</p>
</header>

<div class="wrap">
  <form class="rail" id="form" autocomplete="off">
    <fieldset>
      <legend>Style</legend>
      <div class="seg" id="style" role="group" aria-label="Opener style">
        <button type="button" data-v="search" aria-pressed="true">Search bar</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Background</legend>
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose a photo or video">
        <strong id="dropName">Choose a photo or clip</strong><br>
        <span>or drop it here. JPG, PNG, MP4 or MOV.</span>
      </div>
      <input type="file" id="file" accept="image/*,video/*" hidden>
      <div class="seg" id="bg" role="group" aria-label="Background">
        <button type="button" data-v="clip" aria-pressed="true">Photo or clip</button>
        <button type="button" data-v="green">Green screen</button>
      </div>
      <label class="check"><input type="checkbox" id="push" checked> Slow push-in on the background</label>
    </fieldset>

    <fieldset>
      <legend>Search</legend>
      <label>Search text
        <input type="text" id="text" value="Homes for Sale in Nords Wharf, NSW" maxlength="80">
      </label>
      <label><span class="lab">Typing speed <output id="cpsOut"></output></span>
        <input type="range" id="cps" min="6" max="30" step="1" value="14">
      </label>
      <label><span class="lab">Hold after typing <output id="holdOut"></output></span>
        <input type="range" id="hold" min="0.3" max="3" step="0.1" value="1.2">
      </label>
      <label class="check"><input type="checkbox" id="tap" checked> Tap the bar before it leaves</label>
    </fieldset>

    <fieldset>
      <legend>Layout</legend>
      <div class="seg" id="fmt" role="group" aria-label="Format">
        <button type="button" data-v="9x16" aria-pressed="true">9:16 Reel</button>
        <button type="button" data-v="4x5">4:5 Feed</button>
      </div>
      <label><span class="lab">Height on screen <output id="posOut"></output></span>
        <input type="range" id="pos" min="0.12" max="0.85" step="0.01" value="0.3">
      </label>
      <div class="row">
        <label><span class="lab">Bar width <output id="widthOut"></output></span>
          <input type="range" id="width" min="0.6" max="0.95" step="0.01" value="0.86">
        </label>
        <label><span class="lab">Bar size <output id="sizeOut"></output></span>
          <input type="range" id="size" min="0.7" max="1.4" step="0.05" value="1">
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Ending</legend>
      <div class="seg" id="ending" role="group" aria-label="Ending">
        <button type="button" data-v="fade" aria-pressed="true">Fade up</button>
        <button type="button" data-v="zoom">Zoom through</button>
        <button type="button" data-v="stay">Stay on screen</button>
      </div>
      <label><span class="lab">Clip after the bar leaves <output id="tailOut"></output></span>
        <input type="range" id="tail" min="0" max="3" step="0.1" value="0.6">
      </label>
      <label class="check"><input type="checkbox" id="sound" checked> Sound effects (pop, whoosh, key clicks)</label>
    </fieldset>
  </form>

  <section class="proof" aria-label="Preview">
    <div class="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
    <div class="transport">
      <button type="button" class="btn ghost" id="play">Pause</button>
      <input type="range" id="scrub" min="0" max="1" step="0.001" value="0" aria-label="Scrub">
      <output id="clock">0.0 / 0.0 s</output>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="export">Save video</button>
    </div>
    <p class="meta" id="status">Recording runs in real time. Keep this tab in front while it records.</p>
    <div class="result" id="result" hidden>
      <video id="out" controls playsinline></video>
      <div class="actions"><button type="button" class="btn ghost" id="saveAgain">Save again</button></div>
    </div>
  </section>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const canvas = $("c");
const ctx = canvas.getContext("2d");
const params = new URLSearchParams(location.search);
const RENDER = params.has("render");
if (RENDER) document.body.classList.add("render");

// ---------- settings ----------
const DEFAULTS = { style: "search", text: "Homes for Sale in Nords Wharf, NSW", fmt: "9x16", pos: 0.3, width: 0.86, size: 1, cps: 14, hold: 1.2, tap: true, ending: "fade", tail: 0.6, push: true, bg: "clip", sound: true };
const NUM = ["pos", "width", "size", "cps", "hold", "tail"];
const BOOL = ["tap", "push", "sound"];
let S = { ...DEFAULTS };
if (!RENDER) { try { Object.assign(S, JSON.parse(localStorage.getItem("reel-opener") || "{}")); } catch {} }
for (const [k, v] of params) {
  if (!(k in DEFAULTS)) continue;
  S[k] = NUM.includes(k) ? Number(v) : BOOL.includes(k) ? v !== "0" && v !== "false" : v;
}
const save = () => { try { localStorage.setItem("reel-opener", JSON.stringify(S)); } catch {} };

const size = () => ({ W: 1080, H: S.fmt === "4x5" ? 1350 : 1920 });

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2; };
const easeInOutCubic = x => x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2;
const easeOutCubic = x => 1 - (1 - x) ** 3;
const easeInCubic = x => x ** 3;
const hash = i => { const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- background ----------
let media = null; // HTMLImageElement or HTMLVideoElement
const isVideo = () => media instanceof HTMLVideoElement;

function drawBackground(t, end, W, H) {
  if (S.bg === "alpha") { ctx.clearRect(0, 0, W, H); return; }
  if (S.bg === "green") { ctx.fillStyle = "#00b140"; ctx.fillRect(0, 0, W, H); return; }
  const zoom = S.push ? 1 + 0.08 * clamp(t / Math.max(end, 0.1)) : 1;
  const ready = media && (isVideo() ? media.readyState >= 2 : media.complete && media.naturalWidth);
  if (!ready) { drawSampleSky(W, H, zoom); return; }
  const mw = isVideo() ? media.videoWidth : media.naturalWidth;
  const mh = isVideo() ? media.videoHeight : media.naturalHeight;
  const k = Math.max(W / mw, H / mh) * zoom;
  const dw = mw * k, dh = mh * k;
  ctx.drawImage(media, (W - dw) / 2, (H - dh) / 2, dw, dh);
}

// Stand-in until a photo is added: a dusk sky and a low roofline.
function drawSampleSky(W, H, zoom) {
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(zoom, zoom); ctx.translate(-W / 2, -H / 2);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#27304a"); g.addColorStop(0.45, "#5d6283"); g.addColorStop(0.75, "#a89aa6"); g.addColorStop(1, "#d8b89a");
  ctx.fillStyle = g; ctx.fillRect(-W, -H, W * 3, H * 3);
  const y = H * 0.62;
  ctx.fillStyle = "#3a3d47";
  ctx.beginPath();
  ctx.moveTo(-W, H * 2); ctx.lineTo(-W, y + 40); ctx.lineTo(W * 0.12, y + 40); ctx.lineTo(W * 0.3, y - 70); ctx.lineTo(W * 0.48, y + 40);
  ctx.lineTo(W * 0.55, y + 40); ctx.lineTo(W * 0.72, y - 40); ctx.lineTo(W * 0.9, y + 40); ctx.lineTo(W * 2, y + 40); ctx.lineTo(W * 2, H * 2); ctx.fill();
  ctx.fillStyle = "#f2c879";
  for (const [x, w] of [[0.2, 0.06], [0.33, 0.06], [0.62, 0.1], [0.78, 0.06]]) ctx.fillRect(W * x, y + 110, W * w, H * 0.06);
  ctx.restore();
}

// ---------- style: search bar ----------
// Each style returns a plan (its timeline) and draws one frame at time t.
// New styles go in STYLES and get a button in #style.
const STYLES = {
  search: {
    plan(o) {
      const tPop = 0.15, tIcon = 0.4, tExpand = 0.95, expandDur = 0.6;
      const tType = tExpand + expandDur + 0.2;
      const keys = []; let acc = 0;
      [...o.text].forEach((ch, i) => {
        acc += (1 / o.cps) * (0.55 + 0.9 * hash(i + 1)) * (ch === " " ? 1.25 : 1);
        keys.push(tType + acc);
      });
      const tTyped = keys.length ? keys[keys.length - 1] : tType;
      const tTap = tTyped + o.hold;
      const tExit = tTap + (o.tap ? 0.35 : 0);
      const exitDur = o.ending === "stay" ? 0 : o.ending === "zoom" ? 0.6 : 0.5;
      const end = tExit + exitDur + o.tail;
      const sounds = [{ t: tPop, kind: "pop" }, { t: tExpand, kind: "whoosh", dur: expandDur }];
      keys.forEach((t, i) => { if (o.text[i] !== " ") sounds.push({ t, kind: "key", i }); else sounds.push({ t, kind: "space", i }); });
      if (o.tap) sounds.push({ t: tTap, kind: "tap" });
      if (o.ending !== "stay") sounds.push({ t: tExit, kind: "whoosh", dur: exitDur, out: true });
      return { tPop, tIcon, tExpand, expandDur, tType, keys, tTyped, tTap, tExit, exitDur, end, sounds };
    },
    draw(t, o, P, W, H) {
      if (t < P.tPop) return;
      const bh = Math.round(W * 0.112 * o.size);
      const fullW = Math.max(bh, W * o.width);
      const cx = W / 2, cy = H * o.pos;
      const s = easeOutBack(clamp((t - P.tPop) / 0.42));
      const e = easeInOutCubic(clamp((t - P.tExpand) / P.expandDur));
      const w = bh + (fullW - bh) * e;

      let press = 1;
      if (o.tap && t >= P.tTap) press = 1 - 0.04 * Math.sin(Math.PI * clamp((t - P.tTap) / 0.3));

      let alpha = 1, dy = 0, grow = 1;
      if (o.ending !== "stay" && t >= P.tExit) {
        const k = clamp((t - P.tExit) / P.exitDur);
        if (o.ending === "fade") { alpha = 1 - easeInCubic(k) * 0.999; dy = -H * 0.05 * easeInCubic(k); }
        else { grow = 1 + 7 * easeInCubic(k); alpha = 1 - clamp((k - 0.3) / 0.7); }
      }
      if (alpha <= 0.002) return;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(cx, cy + dy);
      const sc = s * press * grow; ctx.scale(sc, sc);

      // Pill with a soft shadow.
      const x = -w / 2, y = -bh / 2, r = bh / 2;
      ctx.shadowColor = "rgba(0,0,0,0.22)"; ctx.shadowBlur = bh * 0.35; ctx.shadowOffsetY = bh * 0.08;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.roundRect(x, y, w, bh, r); ctx.fill();
      ctx.shadowColor = "transparent";

      // Magnifier: draws itself in, then shrinks and slides left as the bar opens.
      const ip = easeOutCubic(clamp((t - P.tIcon) / 0.45));
      const isz = bh * (0.5 - 0.16 * e);
      drawMagnifier(x + r + bh * 0.04 * e, 0, isz, ip);

      // Typed text and caret.
      const typed = P.keys.filter(k => k <= t).length;
      const textX = x + bh * 0.95;
      const room = fullW - bh * 0.95 - bh * 0.45;
      ctx.font = `400 ${bh * 0.36}px Roboto, "Helvetica Neue", Arial, sans-serif`;
      const fs = bh * 0.36 * Math.min(1, room / Math.max(1, ctx.measureText(o.text).width));
      ctx.font = `400 ${fs}px Roboto, "Helvetica Neue", Arial, sans-serif`;
      ctx.save();
      ctx.beginPath(); ctx.roundRect(x, y, w, bh, r); ctx.clip();
      const str = o.text.slice(0, typed);
      ctx.fillStyle = "#3c4043"; ctx.textBaseline = "middle";
      ctx.fillText(str, textX, bh * 0.02);
      if (e >= 1 && t >= P.tType - 0.35 && !(o.tap && t >= P.tTap)) {
        const last = typed ? P.keys[typed - 1] : P.tType - 0.35;
        const typing = t < P.tTyped + 0.3;
        const on = typing || ((t - last) % 1.0) < 0.55;
        if (on) {
          ctx.fillStyle = "#1a73e8";
          const cxr = textX + ctx.measureText(str).width + fs * 0.06;
          ctx.fillRect(cxr, -fs * 0.62, Math.max(2, fs * 0.07), fs * 1.24);
        }
      }
      ctx.restore();
      ctx.restore();
    },
  },
};

function drawMagnifier(x, y, sz, p) {
  if (p <= 0) return;
  const lw = sz * 0.13, R = sz * 0.3, ox = x - sz * 0.08, oy = y - sz * 0.08;
  ctx.save();
  ctx.strokeStyle = "#9aa0a6"; ctx.lineWidth = lw; ctx.lineCap = "round";
  const a = clamp(p / 0.7);
  ctx.beginPath(); ctx.arc(ox, oy, R, Math.PI * 0.25, Math.PI * 0.25 + Math.PI * 2 * a); ctx.stroke();
  const h = clamp((p - 0.6) / 0.4);
  if (h > 0) {
    const sx = ox + R * Math.SQRT1_2, sy = oy + R * Math.SQRT1_2, L = sz * 0.26 * h;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + L, sy + L); ctx.stroke();
  }
  ctx.restore();
}

// ---------- frame ----------
let P = STYLES[S.style].plan(S);
function replan() { P = STYLES[S.style].plan(S); scrub.max = P.end; }
function render(t) {
  const { W, H } = size();
  drawBackground(t, P.end, W, H);
  STYLES[S.style].draw(t, S, P, W, H);
}

// ---------- sound ----------
// Synthesised from noise and sine, so there is nothing to license.
let audioCache = { key: "", buf: null };
async function buildAudio() {
  const key = JSON.stringify([S.style, S.text, S.cps, S.hold, S.tap, S.ending, S.tail]);
  if (audioCache.key === key) return audioCache.buf;
  const sr = 48000, ac = new OfflineAudioContext(2, Math.ceil((P.end + 0.3) * sr), sr);
  const rnd = mulberry32(7);
  const noise = ac.createBuffer(1, sr, sr);
  const nd = noise.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = rnd() * 2 - 1;
  const master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);

  const env = (g, t, peak, a, d) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };
  const panTo = (node, pan) => { const p = ac.createStereoPanner(); p.pan.value = pan; node.connect(p); p.connect(master); };
  const noiseHit = (t, f, q, peak, a, d, pan = 0, offset = 0) => {
    const src = ac.createBufferSource(); src.buffer = noise;
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = q;
    const g = ac.createGain(); env(g, t, peak, a, d);
    src.connect(bp); bp.connect(g); panTo(g, pan);
    src.start(t, offset, a + d + 0.05);
    return bp;
  };
  const tone = (t, f0, f1, peak, a, d, type = "sine", pan = 0) => {
    const o = ac.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + a + d);
    const g = ac.createGain(); env(g, t, peak, a, d);
    o.connect(g); panTo(g, pan); o.start(t); o.stop(t + a + d + 0.05);
  };

  for (const s of P.sounds) {
    const t = s.t;
    if (s.kind === "pop") { tone(t, 380, 900, 0.5, 0.006, 0.16); noiseHit(t, 3000, 1.2, 0.12, 0.002, 0.03); }
    else if (s.kind === "whoosh") {
      const d = s.dur || 0.5;
      const bp = noiseHit(t, 600, 0.7, s.out ? 0.22 : 0.3, d * 0.55, d * 0.6, 0, 0.3);
      bp.frequency.setValueAtTime(s.out ? 2600 : 450, t);
      bp.frequency.exponentialRampToValueAtTime(s.out ? 500 : 2600, t + d);
    }
    else if (s.kind === "key" || s.kind === "space") {
      const r = hash(s.i * 3.1 + 2);
      const pan = (r - 0.5) * 0.3;
      noiseHit(t, s.kind === "space" ? 1500 : 2600 + r * 1600, 2.5, s.kind === "space" ? 0.35 : 0.45, 0.001, 0.035, pan, r * 0.5);
      tone(t, 220 + r * 40, 140, 0.12, 0.002, 0.03, "sine", pan);
    }
    else if (s.kind === "tap") { tone(t, 320, 160, 0.4, 0.003, 0.08); noiseHit(t, 2000, 1.5, 0.2, 0.001, 0.02); }
  }
  const buf = await ac.startRendering();
  audioCache = { key, buf };
  return buf;
}

function wavBytes(buf) {
  const ch = buf.numberOfChannels, n = buf.length, sr = buf.sampleRate;
  const out = new DataView(new ArrayBuffer(44 + n * ch * 2));
  const str = (o, s) => { for (let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)); };
  str(0, "RIFF"); out.setUint32(4, 36 + n * ch * 2, true); str(8, "WAVE"); str(12, "fmt ");
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, ch, true); out.setUint32(24, sr, true);
  out.setUint32(28, sr * ch * 2, true); out.setUint16(32, ch * 2, true); out.setUint16(34, 16, true); str(36, "data"); out.setUint32(40, n * ch * 2, true);
  const data = [...Array(ch)].map((_, c) => buf.getChannelData(c));
  let o = 44;
  for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) { out.setInt16(o, clamp(data[c][i], -1, 1) * 0x7fff, true); o += 2; }
  return out.buffer;
}

// ---------- render mode hooks (render.mjs) ----------
async function loadMedia(src, kind) {
  if (kind === "video") {
    const v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = src;
    await new Promise((ok, bad) => { v.onloadeddata = ok; v.onerror = () => bad(new Error("This browser could not read that clip. Try an H.264 MP4.")); });
    return v;
  }
  const img = new Image(); img.src = src;
  await img.decode();
  return img;
}
const fontsReady = Promise.all(["400 40px Roboto", "500 40px Roboto"].map(f => document.fonts.load(f).catch(() => null)));
window.ready = (async () => {
  await fontsReady;
  if (RENDER && params.get("photo")) media = await loadMedia(params.get("photo"), "image");
  const { W, H } = size(); canvas.width = W; canvas.height = H;
  replan();
  return { end: P.end, W, H };
})();
window.draw = t => render(t);
window.audioWav = async () => {
  const bytes = new Uint8Array(wavBytes(await buildAudio()));
  let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(s);
};

// ---------- interactive UI ----------
const scrub = $("scrub"), playBtn = $("play"), clock = $("clock"), status = $("status");
let playing = !RENDER, t0 = performance.now(), cur = 0, recording = false;
let actx = null, sfx = null;

function stopSound() { try { sfx && sfx.stop(); } catch {} sfx = null; }
async function startSound(at, dest) {
  stopSound();
  if (!S.sound) return;
  actx = actx || new AudioContext();
  if (actx.state === "suspended") await actx.resume().catch(() => {});
  const buf = await buildAudio();
  sfx = actx.createBufferSource(); sfx.buffer = buf;
  sfx.connect(dest || actx.destination);
  sfx.start(actx.currentTime + 0.01, at);
}
let soundArmed = false; // only after the viewer has pressed something

function syncVideo(t, play) {
  if (!isVideo()) return;
  if (Math.abs(media.currentTime - t) > 0.08) media.currentTime = Math.min(t, (media.duration || t) - 0.01);
  if (play) media.play().catch(() => {}); else media.pause();
}

function restart() {
  t0 = performance.now(); cur = 0;
  syncVideo(0, playing);
  if (playing && soundArmed) startSound(0);
}

function tick(now) {
  if (playing) {
    cur = (now - t0) / 1000;
    if (cur > P.end) {
      if (recording) cur = P.end;
      else restart();
    }
  }
  render(cur);
  scrub.value = cur;
  clock.value = `${cur.toFixed(1)} / ${P.end.toFixed(1)} s`;
  requestAnimationFrame(tick);
}

function setPlaying(p) {
  playing = p; playBtn.textContent = p ? "Pause" : "Play";
  if (p) { t0 = performance.now() - cur * 1000; syncVideo(cur, true); if (soundArmed) startSound(cur); }
  else { syncVideo(cur, false); stopSound(); }
}

function changed() {
  save(); replan(); updateOutputs();
  const { W, H } = size();
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
  $("dims").textContent = `${W} × ${H} px · ${S.fmt === "4x5" ? "4:5 feed" : "9:16 Reel"}`;
  if (cur > P.end) cur = 0;
}

function updateOutputs() {
  $("cpsOut").value = `${S.cps} keys/s`;
  $("holdOut").value = `${S.hold.toFixed(1)} s`;
  $("posOut").value = `${Math.round(S.pos * 100)}%`;
  $("widthOut").value = `${Math.round(S.width * 100)}%`;
  $("sizeOut").value = `${Math.round(S.size * 100)}%`;
  $("tailOut").value = `${S.tail.toFixed(1)} s`;
}

function bindSeg(id) {
  const el = $(id);
  const sync = () => el.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === S[id])));
  el.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S[id] = b.dataset.v; sync(); changed(); restart(); });
  sync();
}

async function setFile(f) {
  if (!f) return;
  const kind = f.type.startsWith("video") ? "video" : "image";
  try {
    const m = await loadMedia(URL.createObjectURL(f), kind);
    if (isVideo()) media.pause();
    media = m;
    $("dropName").textContent = f.name;
    S.bg = "clip"; bindSegSync("bg");
    restart();
  } catch (err) {
    status.textContent = kind === "image" ? "That photo could not be read. HEIC files need converting to JPG first." : err.message;
  }
}
function bindSegSync(id) { $(id).querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === S[id]))); }

// ---------- export ----------
let lastBlob = null, lastName = "";
function pickMime() {
  // H.264 MP4 first (Chrome 126+, Safari). A bare "video/mp4" goes last because
  // Chrome without H.264 fills it with VP9, which Instagram handles badly.
  const opts = ["video/mp4;codecs=avc1.640028,mp4a.40.2", "video/mp4;codecs=avc1,mp4a", "video/mp4;codecs=avc1", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm", "video/mp4"];
  return opts.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
}
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 48) || "opener";

async function saveBlob(blob, name) {
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(() => null) : null;
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); status.textContent = `Saved ${name}.`; }
    catch (e) { status.textContent = e && e.code === "declined" ? "Save cancelled. Use Save again when you are ready." : `Could not save the file (${e && e.code || "error"}). Try Save again.`; }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  status.textContent = `Saved ${name}.`;
}

async function exportVideo() {
  const mime = pickMime();
  if (!mime || !canvas.captureStream) { status.textContent = "This browser cannot record video. Use Chrome, Edge or Safari, or render with render.mjs."; return; }
  const btn = $("export"); btn.disabled = true;
  soundArmed = true;
  setPlaying(false); stopSound();
  cur = 0; render(0);
  if (isVideo()) { media.currentTime = 0; await new Promise(ok => { media.onseeked = ok; setTimeout(ok, 800); }); }

  const stream = canvas.captureStream(30);
  if (S.sound) {
    actx = actx || new AudioContext();
    await actx.resume().catch(() => {});
    const dest = actx.createMediaStreamDestination();
    await startSound(0, dest);
    dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
  }
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 14_000_000 });
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const done = new Promise(ok => rec.onstop = ok);
  recording = true;
  rec.start(250);
  t0 = performance.now(); playing = true; playBtn.textContent = "Pause";
  syncVideo(0, true);
  const timer = setInterval(() => { status.textContent = `Recording ${cur.toFixed(1)} of ${P.end.toFixed(1)} s. Keep this tab in front.`; }, 100);
  await new Promise(ok => setTimeout(ok, P.end * 1000 + 150));
  rec.stop(); await done;
  clearInterval(timer); recording = false; stopSound();
  stream.getTracks().forEach(tr => tr.stop());

  const ext = mime.includes("mp4") ? "mp4" : "webm";
  lastBlob = new Blob(chunks, { type: mime.split(";")[0] });
  lastName = `opener-${slug(S.text)}.${ext}`;
  $("out").src = URL.createObjectURL(lastBlob);
  $("result").hidden = false;
  status.textContent = `Recorded ${(lastBlob.size / 1e6).toFixed(1)} MB ${ext.toUpperCase()}.`;
  btn.disabled = false;
  setPlaying(false); cur = 0; restart();
  await saveBlob(lastBlob, lastName);
}

if (!RENDER) {
  for (const id of ["style", "bg", "fmt", "ending"]) bindSeg(id);
  $("text").value = S.text;
  for (const id of NUM) { $(id).value = S[id]; $(id).addEventListener("input", () => { S[id] = Number($(id).value); changed(); }); }
  for (const id of BOOL) { $(id).checked = S[id]; $(id).addEventListener("change", () => { S[id] = $(id).checked; changed(); if (id === "sound") { soundArmed = true; restart(); } }); }
  $("text").addEventListener("input", () => { S.text = $("text").value; changed(); });
  for (const id of ["text", "cps", "hold", "tail"]) $(id).addEventListener("change", restart);

  const drop = $("drop"), file = $("file");
  drop.addEventListener("click", () => file.click());
  drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); file.click(); } });
  file.addEventListener("change", () => setFile(file.files[0]));
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); setFile(e.dataTransfer.files[0]); });

  playBtn.addEventListener("click", () => { soundArmed = true; setPlaying(!playing); });
  scrub.addEventListener("input", () => { setPlaying(false); cur = Number(scrub.value); syncVideo(cur, false); });
  $("export").addEventListener("click", exportVideo);
  $("saveAgain").addEventListener("click", () => lastBlob && saveBlob(lastBlob, lastName));
  document.addEventListener("submit", e => e.preventDefault());
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { playing = false; cur = 3; playBtn.textContent = "Play"; }

  window.ready.then(() => { changed(); restart(); requestAnimationFrame(tick); });
}
</script>
